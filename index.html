<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar chords</title>
<style>
  :root{
    --bg:#f6f1e9; --ink:#241c15; --muted:#7a6e61; --chip:#ebe3d6; --chip-hover:#e0d5c3;
    --accent:#e8791c; --accent-ink:#fff; --card:#fff; --line:#1b1b1b;
    --yellow:#f7c244; --orange:#ee8a2e; --dot-stroke:#c4691a; --red:#9b1c1c;
    --root-bg:#fde3c8; --root-ink:#8a3f00;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17130f; --ink:#f3ece1; --muted:#a39685; --chip:#2a231c; --chip-hover:#372e24;
      --root-bg:#4a2c10; --root-ink:#ffd2a1;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  main{max-width:560px; margin:0 auto; padding:28px 16px 48px}
  h1{font-size:1.5rem; margin:0 0 20px; letter-spacing:-.01em}
  .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 8px}

  /* 1. notes */
  .roots{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
  .roots button{
    font:inherit; font-size:1.5rem; font-weight:700; padding:12px 0; border:0; border-radius:14px;
    background:var(--chip); color:var(--ink); cursor:pointer; transition:background .15s, transform .1s;
  }
  .roots button:hover{background:var(--chip-hover)}
  .roots button:active{transform:scale(.97)}
  .roots button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

  /* 2. accords de la note */
  .types{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .types button{
    font:inherit; font-size:.95rem; font-weight:600; padding:8px 15px; border:2px solid transparent; border-radius:999px;
    background:var(--chip); color:var(--ink); cursor:pointer; transition:background .15s;
  }
  .types button:hover{background:var(--chip-hover)}
  .types button[aria-pressed="true"]{background:var(--root-bg); color:var(--root-ink); border-color:var(--accent)}

  /* 3. niveaux  +  4. mode d'affichage */
  .levels,.modes{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px}
  .levels button,.modes button{
    font:inherit; font-size:.95rem; font-weight:600; padding:9px 16px; border:0; border-radius:999px;
    background:var(--chip); color:var(--ink); cursor:pointer; transition:background .15s;
  }
  .levels button:hover,.modes button:hover{background:var(--chip-hover)}
  .levels button[aria-pressed="true"],.modes button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  .card{background:var(--card); border-radius:18px; padding:14px 8px 6px; box-shadow:0 2px 14px rgba(0,0,0,.08)}
  .card h2{margin:0; text-align:center; font-size:1.7rem; font-weight:500; color:#111; letter-spacing:-.01em}
  .card svg{display:block; width:100%; max-width:380px; height:auto; margin:0 auto}

  .info{margin-top:18px; display:grid; gap:16px}
  .tip{margin:0; font-size:1rem}
  .tab{display:inline-grid; grid-template-columns:repeat(6,2.4rem); text-align:center; font-family:ui-monospace,Menlo,monospace}
  .tab span{padding:2px 0}
  .tab .names{color:var(--muted); font-size:.8rem}
  .tab .fr{font-size:1.1rem; font-weight:700}
  .legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.85rem; color:var(--muted); margin:0; padding:0; list-style:none}
  .legend li{display:flex; align-items:center; gap:6px}
  .legend svg{width:22px; height:22px; flex:none}
  .hint{font-size:.8rem; color:var(--muted); margin:0}

  /* onglets Accords / Fretboard */
  main.wide{max-width:1000px}
  .views{display:flex; gap:22px; margin-bottom:22px; border-bottom:2px solid var(--chip)}
  .views button{
    font:inherit; font-size:1rem; font-weight:700; padding:6px 2px 10px; margin-bottom:-2px; border:0;
    border-bottom:3px solid transparent; background:none; color:var(--muted); cursor:pointer;
  }
  .views button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--accent)}

  /* fretboard */
  .controls{display:flex; flex-wrap:wrap; column-gap:36px; align-items:flex-end}
  .modes button.ghost{background:none; border:2px solid var(--chip-hover); padding:7px 14px}
  .modes button.ghost:disabled{opacity:.4; cursor:default}
  .scroll{overflow-x:auto}
  .card #fretboard{max-width:none; min-width:700px; margin:0}
  .cell.rev{cursor:pointer}
  .cell.rev:hover circle{stroke:var(--accent); stroke-width:3.5}
  .cell:focus{outline:none}
  .cell:focus-visible circle{stroke:var(--line); stroke-width:4}
  #fbHint{margin-top:14px}

  /* quiz */
  .quiz-msg{margin:18px 0 12px; font-size:1.15rem; font-weight:600}
  .answers{display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:8px; max-width:640px}
  .answers button{
    font:inherit; font-size:1.05rem; font-weight:700; padding:12px 0; border:0; border-radius:12px;
    background:var(--chip); color:var(--ink); cursor:pointer;
  }
  .answers button:hover:enabled{background:var(--chip-hover)}
  .answers button:disabled{cursor:default; opacity:.45}
  .answers button.wrong{background:#b23b3b; color:#fff; opacity:.7}
  .answers button.right{background:#2e8540; color:#fff; opacity:1}
  .quiz-bar{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-top:16px; max-width:640px; font-weight:600}
  .quiz-bar .modes{margin:0}
</style>
</head>
<body>
<main>
  <h1>Guitar chords</h1>

  <nav class="views" id="views" aria-label="Rubriques">
    <button type="button" data-view="chords" aria-pressed="true">Accords</button>
    <button type="button" data-view="fretboard" aria-pressed="false">Fretboard</button>
  </nav>

  <div id="viewChords">
  <div class="roots" id="roots" role="group" aria-label="Note"></div>
  <div class="types" id="types" role="group" aria-label="Accord"></div>

  <div id="levelsBox">
    <p class="label">Niveau</p>
    <div class="levels" id="levels" role="group" aria-label="Niveau de difficulté"></div>
  </div>

  <p class="label">Affichage</p>
  <div class="modes" id="modes" role="group" aria-label="Contenu des pastilles"></div>

  <section class="card" aria-live="polite">
    <h2 id="title"></h2>
    <svg id="diagram" viewBox="0 0 360 400" role="img"></svg>
  </section>

  <div class="info">
    <p class="tip" id="tip"></p>
    <div><p class="label">Frettes (E A D G B e)</p><div class="tab" id="tab"></div></div>
    <ul class="legend" id="legend"></ul>
    <p class="hint" id="hint">Astuce : les flèches ← → changent de niveau.</p>
  </div>
  </div><!-- /viewChords -->

  <div id="viewFret" hidden>
    <div class="controls">
      <div>
        <p class="label">Notation</p>
        <div class="modes" id="fbNotation" role="group" aria-label="Notation"></div>
      </div>
      <div>
        <p class="label">Notes affichées</p>
        <div class="modes" id="fbNotes" role="group" aria-label="Notes affichées"></div>
      </div>
      <div>
        <p class="label">Mode</p>
        <div class="modes" id="fbMode" role="group" aria-label="Mode"></div>
      </div>
      <div id="fbExerciseBox" hidden>
        <p class="label">Type de révision</p>
        <div class="modes" id="fbExercise" role="group" aria-label="Type de révision"></div>
      </div>
    </div>
    <section class="card">
      <div class="scroll">
        <svg id="fretboard" viewBox="0 0 880 384" role="group" aria-label="Manche de guitare, cases 0 à 12"></svg>
      </div>
    </section>
    <div id="quiz" hidden>
      <p class="quiz-msg" id="quizMsg" aria-live="polite"></p>
      <div class="answers" id="quizAnswers" role="group" aria-label="Réponses"></div>
      <div class="quiz-bar">
        <span id="quizScore"></span>
        <div class="modes" id="quizActions"></div>
      </div>
    </div>
    <p class="hint" id="fbHint"></p>
  </div>
</main>

<script>
/* ============================================================
   DONNÉES — modifiables à la main.
   Cordes dans l'ordre 0..5 = E A D G B e (grave → aiguë).
   Un accord = { id, label, root (note), type, base, levels:[…] }
     - type : sert à garder « majeur » / « mineur » quand on change de note.
     - base : première case affichée sur le manche.
   Un niveau = { id, name, frets, fingers, tip }
     - frets  : une valeur par corde ('x' = non jouée, 0 = à vide).
     - fingers: [case, corde début, corde fin, doigt] ; début≠fin = barré / mini-barré.
                doigt = '1'..'4' ou 'T' (pouce).
   Un accord avec un seul niveau n'affiche pas les boutons « Level ».
   ============================================================ */
const x = 'x';
const single = (frets, fingers, tip) => [{ id:'std', name:'', frets, fingers, tip }];

const CHORDS = [
  /* ---------- A ---------- */
  { id:'A', label:'A', root:'A', type:'maj', base:1, levels: single(
      [x,0,2,2,2,0], [[2,2,2,'1'],[2,3,3,'2'],[2,4,4,'3']],
      'Trois doigts côte à côte à la case 2 (D, G, B). Le E grave n’est pas joué.') },
  { id:'Am', label:'Am', root:'A', type:'min', base:1, levels: single(
      [x,0,2,2,1,0], [[1,4,4,'1'],[2,2,2,'2'],[2,3,3,'3']],
      'Index sur B (case 1), majeur sur D et annulaire sur G (case 2). Le E grave n’est pas joué.') },
  { id:'A7sus4a', label:'A7sus4 (1)', root:'A', type:'7sus4', base:1, levels: single(
      [x,0,2,0,3,3], [[2,2,2,'1'],[3,4,4,'3'],[3,5,5,'4']],
      'A et G à vide. Index sur D (case 2), annulaire et auriculaire sur B et e (case 3). Le E grave n’est pas joué.') },
  { id:'A7sus4b', label:'A7sus4 (2)', root:'A', type:'7sus4', base:1, levels: single(
      [x,0,2,2,3,3], [[2,2,2,'1'],[2,3,3,'2'],[3,4,4,'3'],[3,5,5,'4']],
      'Variante avec G tenu à la case 2 : index sur D, majeur sur G, annulaire et auriculaire sur B et e (case 3). Le E grave n’est pas joué.') },

  /* ---------- B ---------- */
  { id:'B', label:'B', root:'B', type:'maj', base:2, levels:[
    { id:'l1', name:'Level 1', frets:[x,x,4,4,4,x],
      fingers:[[4,2,2,'1'],[4,3,3,'2'],[4,4,4,'3']],
      tip:'Un doigt par corde, tous à la case 4 : index sur D, majeur sur G, annulaire sur B. Joue uniquement ces 3 cordes.' },
    { id:'l2', name:'Level 2', frets:[x,x,4,4,4,2],
      fingers:[[4,2,2,'2'],[4,3,3,'3'],[4,4,4,'4'],[2,5,5,'1']],
      tip:'On ajoute l’index sur la corde e (case 2) : majeur, annulaire et auriculaire tiennent D, G et B à la case 4.' },
    { id:'l3', name:'Level 3', frets:[x,2,4,4,4,x],
      fingers:[[2,1,1,'1'],[4,2,2,'2'],[4,3,3,'3'],[4,4,4,'4']],
      tip:'L’index passe sur la corde de A (case 2) : tu as maintenant la fondamentale B dans les graves. Majeur, annulaire et auriculaire sur D, G, B (case 4). Étouffe E et e.' },
    { id:'bar', name:'Bar chord', frets:[x,2,4,4,4,2],
      fingers:[[2,1,5,'1'],[4,2,2,'2'],[4,3,3,'3'],[4,4,4,'4']],
      tip:'L’index barre de A à e à la case 2 ; majeur, annulaire et auriculaire sur D, G, B (case 4). Le E grave n’est pas joué.' }
  ]},
  { id:'Bm', label:'Bm', root:'B', type:'min', base:2, levels:[
    { id:'l1', name:'Level 1', frets:[x,x,0,4,3,2],
      fingers:[[4,3,3,'3'],[3,4,4,'2'],[2,5,5,'1']],
      tip:'Version la plus facile : D à vide + 3 cordes aiguës. Aucun barré. La corde de A reste muette.' },
    { id:'l2', name:'Level 2', frets:[x,x,4,4,3,2],
      fingers:[[4,2,3,'3'],[3,4,4,'2'],[2,5,5,'1']],
      tip:'On remplace le D à vide par la case 4 : l’annulaire se couche sur D et G.' },
    { id:'l3', name:'Level 3', frets:[x,2,4,4,3,x],
      fingers:[[2,1,1,'1'],[4,2,2,'3'],[4,3,3,'4'],[3,4,4,'2']],
      tip:'La forme complète du Bm barré, mais sans la corde e : index sur A (case 2), majeur B3, annulaire D4, auriculaire G4.' },
    { id:'bar', name:'Bar chord', frets:[x,2,4,4,3,2],
      fingers:[[2,1,5,'1'],[4,2,2,'3'],[4,3,3,'4'],[3,4,4,'2']],
      tip:'L’index barre de A à e à la case 2, puis majeur (B3), annulaire (D4), auriculaire (G4). Le E grave n’est pas joué.' }
  ]},

  /* ---------- C ---------- */
  { id:'C', label:'C', root:'C', type:'maj', base:1, levels: single(
      [x,3,2,0,1,0], [[3,1,1,'3'],[2,2,2,'2'],[1,4,4,'1']],
      'Annulaire sur A (case 3), majeur sur D (case 2), index sur B (case 1). Le E grave n’est pas joué.') },
  { id:'Cadd9', label:'Cadd9', root:'C', type:'add9', base:1, levels: single(
      [x,3,2,0,3,3], [[3,1,1,'2'],[2,2,2,'1'],[3,4,4,'3'],[3,5,5,'4']],
      'Majeur sur A (case 3), index sur D (case 2), annulaire et auriculaire sur B et e (case 3). G à vide. Le E grave n’est pas joué.') },

  /* ---------- D ---------- */
  { id:'D', label:'D', root:'D', type:'maj', base:1, levels: single(
      [x,x,0,2,3,2], [[2,3,3,'1'],[3,4,4,'3'],[2,5,5,'2']],
      'Un triangle de trois doigts : index sur G, majeur sur e (case 2), annulaire sur B (case 3). Ne joue pas les deux cordes graves.') },
  { id:'Dm', label:'Dm', root:'D', type:'min', base:1, levels: single(
      [x,x,0,2,3,1], [[2,3,3,'2'],[3,4,4,'3'],[1,5,5,'1']],
      'Même triangle que D, mais e à la case 1 : index sur e, majeur sur G, annulaire sur B. Ne joue pas les deux cordes graves.') },
  { id:'Dsus4', label:'Dsus4', root:'D', type:'sus4', base:1, levels: single(
      [x,x,0,2,3,3], [[2,3,3,'1'],[3,4,4,'3'],[3,5,5,'4']],
      'D à vide, index sur G (case 2), annulaire et auriculaire sur B et e (case 3). Ne joue pas les deux cordes graves.') },
  { id:'Dadd11', label:'Dadd11/F#', root:'D', type:'add11', base:1, levels: single(
      [2,x,0,2,3,3], [[2,0,0,'1'],[2,3,3,'2'],[3,4,4,'3'],[3,5,5,'4']],
      'Index sur le E grave (case 2) : la basse est un F#. Majeur sur G (case 2), annulaire et auriculaire sur B et e (case 3). La corde de A est muette.') },

  /* ---------- E ---------- */
  { id:'E', label:'E', root:'E', type:'maj', base:1, levels: single(
      [0,2,2,1,0,0], [[2,1,1,'2'],[2,2,2,'3'],[1,3,3,'1']],
      'Majeur sur A et annulaire sur D (case 2), index sur G (case 1). Les 6 cordes sonnent.') },
  { id:'Em', label:'Em', root:'E', type:'min', base:1, levels: single(
      [0,2,2,0,0,0], [[2,1,1,'2'],[2,2,2,'3']],
      'Majeur sur A et annulaire sur D (case 2). Les 6 cordes sonnent.') },
  { id:'Em7', label:'Em7', root:'E', type:'m7', base:1, levels: single(
      [0,2,2,0,3,3], [[2,1,1,'1'],[2,2,2,'2'],[3,4,4,'3'],[3,5,5,'4']],
      'Index sur A et majeur sur D (case 2), annulaire et auriculaire sur B et e (case 3). E et G à vide. Les 6 cordes sonnent.') },

  /* ---------- F ---------- */
  { id:'F', label:'F', root:'F', type:'maj', base:1, levels:[
    { id:'l1', name:'Level 1', frets:[x,x,3,2,1,x],
      fingers:[[3,2,2,'3'],[2,3,3,'2'],[1,4,4,'1']],
      tip:'Trois cordes seulement (D, G, B), un doigt par corde, aucun barré. Ne gratte pas les autres cordes.' },
    { id:'l2', name:'Level 2', frets:[x,x,3,2,1,1],
      fingers:[[3,2,2,'3'],[2,3,3,'2'],[1,4,5,'1']],
      tip:'L’index se couche sur les deux cordes aiguës (B et e) : c’est un mini-barré.' },
    { id:'l3', name:'Level 3', frets:[x,3,3,2,1,1],
      fingers:[[3,1,1,'3'],[3,2,2,'4'],[2,3,3,'2'],[1,4,5,'1']],
      tip:'On ajoute la corde de A (case 3). Annulaire et auriculaire côte à côte, l’index reste en mini-barré.' },
    { id:'l4', name:'Level 4', frets:[1,0,3,2,1,1],
      fingers:[[1,0,0,'T'],[3,2,2,'3'],[2,3,3,'2'],[1,4,5,'1']],
      tip:'Le pouce passe par-dessus le manche pour jouer le E grave à la case 1. La corde de A reste à vide.' },
    { id:'bar', name:'Bar chord', frets:[1,3,3,2,1,1],
      fingers:[[1,0,5,'1'],[3,1,1,'3'],[3,2,2,'4'],[2,3,3,'2']],
      tip:'L’index barre les 6 cordes à la case 1. C’est la forme de E majeur, décalée d’une case.' }
  ]},
  { id:'F69', label:'F69', root:'F', type:'69', base:1, levels: single(
      [x,x,3,2,3,3], [[3,2,2,'2'],[2,3,3,'1'],[3,4,4,'3'],[3,5,5,'4']],
      'Pas de barré : index sur G (case 2), majeur sur D (case 3), annulaire et auriculaire sur B et e (case 3). Ne joue pas les deux cordes graves.') },

  /* ---------- F# ---------- */
  { id:'Fs', label:'F#', root:'F#', type:'maj', base:2, levels:[
    { id:'l1', name:'Level 1', frets:[x,x,4,3,2,x],
      fingers:[[4,2,2,'3'],[3,3,3,'2'],[2,4,4,'1']],
      tip:'Même forme que le F, une case plus haut. Trois cordes (D, G, B), un doigt par corde.' },
    { id:'l2', name:'Level 2', frets:[x,x,4,3,2,2],
      fingers:[[4,2,2,'3'],[3,3,3,'2'],[2,4,5,'1']],
      tip:'Mini-barré de l’index sur B et e, case 2.' },
    { id:'l3', name:'Level 3', frets:[x,4,4,3,2,2],
      fingers:[[4,1,1,'3'],[4,2,2,'4'],[3,3,3,'2'],[2,4,5,'1']],
      tip:'On ajoute la corde de A (case 4). Annulaire et auriculaire côte à côte.' },
    { id:'l4', name:'Level 4', frets:[2,x,4,3,2,2],
      fingers:[[2,0,0,'T'],[4,2,2,'3'],[3,3,3,'2'],[2,4,5,'1']],
      tip:'Pouce sur le E grave (case 2). Ici le A à vide sonnerait faux : on étouffe la corde de A en l’effleurant avec le pouce.' },
    { id:'bar', name:'Bar chord', frets:[2,4,4,3,2,2],
      fingers:[[2,0,5,'1'],[4,1,1,'3'],[4,2,2,'4'],[3,3,3,'2']],
      tip:'L’index barre les 6 cordes à la case 2 : forme de E majeur décalée de deux cases.' }
  ]},

  /* ---------- G ---------- */
  { id:'G', label:'G', root:'G', type:'maj', base:1, levels: single(
      [3,2,0,0,3,3], [[3,0,0,'2'],[2,1,1,'1'],[3,4,4,'3'],[3,5,5,'4']],
      'Majeur sur le E grave (case 3), index sur A (case 2), annulaire et auriculaire sur B et e (case 3). Les 6 cordes sonnent.') },
  { id:'G5', label:'G5', root:'G', type:'5', base:1, levels: single(
      [3,x,0,0,3,3], [[3,0,0,'2'],[3,4,4,'3'],[3,5,5,'4']],
      'Version « power chord » : majeur sur le E grave, annulaire et auriculaire sur B et e (case 3). D et G à vide, la corde de A est étouffée.') }
];

/* ============================================================
   Utilitaires
   ============================================================ */
const ROOTS = ['A','B','C','D','E','F','F#','G'];
const STRING_NAMES = ['E','A','D','G','B','e'];
const OPEN_SEMITONE = [4,9,2,7,11,4];               // C = 0
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LEVEL_ORDER = ['l1','l2','l3','l4','bar'];
const $ = id => document.getElementById(id);

const SOLFEGE = ['Do','Do#','Ré','Ré#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const MODES = [
  { id:'fingers', name:'Doigts' },
  { id:'letters', name:'A B C' },
  { id:'solfege', name:'Do Ré Mi' }
];
// note jouée sur la corde i à la case fret, selon le mode (letters = A B C…, solfege = Do Ré Mi…)
function noteAt(i, fret, mode){
  const n = (OPEN_SEMITONE[i] + fret) % 12;
  return (mode === 'solfege' ? SOLFEGE : NOTE_NAMES)[n];
}
const fontFor = t => t.length <= 1 ? 22 : t.length === 2 ? 19 : t.length === 3 ? 16 : 13;
const labelSvg = (cx, cy, t) =>
  `<text x="${cx}" y="${cy + fontFor(t)*.36}" text-anchor="middle" font-size="${fontFor(t)}" font-weight="700" fill="#2b1a08">${t}</text>`;

// Contrôle de cohérence (console) : chaque corde jouée et non à vide doit avoir un doigt.
function checkData(){
  CHORDS.forEach(c => c.levels.forEach(l => {
    const tag = `${c.label} ${l.name}`.trim();
    l.frets.forEach((f,i) => {
      if (f === x || f === 0) return;
      const ok = l.fingers.some(([fr,a,b]) => fr === f && i >= a && i <= b);
      if (!ok) console.warn(`${tag}: corde ${STRING_NAMES[i]} case ${f} sans doigt`);
    });
    l.fingers.forEach(([fr,a,b]) => {
      for (let i=a;i<=b;i++){
        const f = l.frets[i];
        // sous un barré, une corde peut être tenue plus haut par un autre doigt (ou muette), jamais à vide
        const okBarre = a < b && f !== 0 && (f === x || f >= fr);
        if (f !== fr && !okBarre)
          console.warn(`${tag}: doigt case ${fr} sur corde ${STRING_NAMES[i]} incohérent`);
      }
    });
  }));
}

/* ============================================================
   Rendu du diagramme (SVG)
   ============================================================ */
const LEFT=78, GAP=44, TOP=84, ROW=62, ROWS=4, R=19;
const sx = i => LEFT + i*GAP;
const dotFill = lab => (lab==='1' || lab==='3') ? 'var(--yellow)' : 'var(--orange)';

function drawDiagram(chord, level, mode){
  const base = chord.base;
  const bottom = TOP + ROWS*ROW;
  let s = '';

  // numéros de cases à gauche
  for (let r=0;r<ROWS;r++)
    s += `<text x="34" y="${TOP+(r+.5)*ROW+8}" text-anchor="middle" font-size="22" fill="var(--muted)">${base+r}</text>`;

  // cases (traits horizontaux)
  for (let r=0;r<=ROWS;r++){
    const thick = (r===0 && base===1);
    s += `<line x1="${sx(0)-1}" x2="${sx(5)+1}" y1="${TOP+r*ROW}" y2="${TOP+r*ROW}" stroke="var(--line)" stroke-width="${thick?9:2.5}" stroke-linecap="square"/>`;
  }
  // cordes
  for (let i=0;i<6;i++)
    s += `<line x1="${sx(i)}" x2="${sx(i)}" y1="${TOP}" y2="${bottom}" stroke="var(--line)" stroke-width="2.5"/>`;

  // noms des cordes
  STRING_NAMES.forEach((n,i) => {
    s += `<text x="${sx(i)}" y="${bottom+34}" text-anchor="middle" font-size="22" fill="var(--muted)">${n}</text>`;
  });

  // cordes muettes / à vide (au-dessus du manche)
  const my = TOP - 34;
  level.frets.forEach((f,i) => {
    if (f === x){
      s += `<path d="M${sx(i)-9} ${my-9} L${sx(i)+9} ${my+9} M${sx(i)+9} ${my-9} L${sx(i)-9} ${my+9}" stroke="var(--red)" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
    } else if (f === 0){
      s += `<circle cx="${sx(i)}" cy="${my}" r="15" fill="var(--orange)" stroke="var(--dot-stroke)" stroke-width="2"/>`;
      if (mode !== 'fingers') s += labelSvg(sx(i), my, noteAt(i, 0, mode)).replace(/font-size="(\d+)"/, (m, n) => `font-size="${Math.min(+n, 15)}"`);
    }
  });

  // doigts (barrés d'abord pour que les doigts simples passent par-dessus)
  const fingers = [...level.fingers].sort((a,b) => (b[2]-b[1]) - (a[2]-a[1]));
  fingers.forEach(([fret,a,b,lab]) => {
    const cy = TOP + (fret - base + .5)*ROW;
    const x1 = sx(a), x2 = sx(b);
    const fill = dotFill(lab);
    const shape = a===b
      ? `<circle cx="${x1}" cy="${cy}" r="${R}" fill="${fill}" stroke="var(--dot-stroke)" stroke-width="2"/>`
      : `<rect x="${x1-R}" y="${cy-R}" width="${x2-x1+2*R}" height="${2*R}" rx="${R}" fill="${fill}" stroke="var(--dot-stroke)" stroke-width="2"/>`;
    let txt = '';
    if (mode === 'fingers') {
      txt = labelSvg((x1+x2)/2, cy, lab);
    } else {
      // une note par corde réellement tenue par ce doigt (sous un barré, les cordes tenues plus haut ont leur propre doigt)
      for (let i=a;i<=b;i++) if (level.frets[i] === fret) txt += labelSvg(sx(i), cy, noteAt(i, fret, mode));
    }
    s += `<g>${shape}${txt}</g>`;
  });

  $('diagram').innerHTML = s;
}

/* ============================================================
   UI
   ============================================================ */
// chord : accord affiché ; pref : niveau souhaité (gardé quand on change d'accord)
// mode : contenu des pastilles — 'fingers' (défaut), 'letters' (A B C), 'solfege' (Do Ré Mi)
const state = { chord:'F', pref:'l1', mode:'fingers' };

function chordById(id){ return CHORDS.find(c => c.id === id) || CHORDS[0]; }

function nearestLevel(chord, wanted){
  if (chord.levels.length === 1) return chord.levels[0].id;
  if (chord.levels.some(l => l.id === wanted)) return wanted;
  const w = LEVEL_ORDER.indexOf(wanted);
  return [...chord.levels].sort((a,b) => {
    const da = Math.abs(LEVEL_ORDER.indexOf(a.id)-w), db = Math.abs(LEVEL_ORDER.indexOf(b.id)-w);
    return da - db || LEVEL_ORDER.indexOf(a.id) - LEVEL_ORDER.indexOf(b.id);
  })[0].id;
}

function render(){
  const chord = chordById(state.chord);
  state.chord = chord.id;
  const level = chord.levels.find(l => l.id === nearestLevel(chord, state.pref));
  const multi = chord.levels.length > 1;
  const siblings = CHORDS.filter(c => c.root === chord.root);

  // 1. notes
  $('roots').innerHTML = ROOTS.map(r =>
    `<button type="button" data-root="${r}" aria-pressed="${r===chord.root}">${r}</button>`).join('');

  // 2. accords de la note choisie (masqué s'il n'y en a qu'un)
  $('types').hidden = siblings.length < 2;
  $('types').innerHTML = siblings.map(c =>
    `<button type="button" data-chord="${c.id}" aria-pressed="${c.id===chord.id}">${c.label}</button>`).join('');

  // 3. niveaux (masqués pour les accords sans progression)
  $('levelsBox').hidden = !multi;
  $('hint').hidden = !multi;
  $('levels').innerHTML = multi ? chord.levels.map(l =>
    `<button type="button" data-level="${l.id}" aria-pressed="${l.id===level.id}">${l.name}</button>`).join('') : '';

  // 4. mode d'affichage
  $('modes').innerHTML = MODES.map(m =>
    `<button type="button" data-mode="${m.id}" aria-pressed="${m.id===state.mode}">${m.name}</button>`).join('');

  // diagramme
  const title = multi ? `${chord.label} ${level.name}` : chord.label;
  $('title').textContent = title;
  $('diagram').setAttribute('aria-label', `Diagramme de ${title}`);
  drawDiagram(chord, level, state.mode);
  renderLegend(state.mode);

  // infos
  $('tip').textContent = level.tip;
  $('tab').innerHTML =
    STRING_NAMES.map(n => `<span class="names">${n}</span>`).join('') +
    level.frets.map(f => `<span class="fr">${f}</span>`).join('');

  if (view === 'chords') setHash(`${chord.id}-${level.id}`);
}

const dotIcon = (fill, txt) =>
  `<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="${fill}" stroke="var(--dot-stroke)" stroke-width="1.5"/>` +
  (txt ? `<text x="11" y="15.5" text-anchor="middle" font-size="12" font-weight="700" fill="#2b1a08">${txt}</text>` : '') + `</svg>`;
function renderLegend(mode){
  const fingerItems = [
    [dotIcon('var(--yellow)','1'), 'index'],
    [dotIcon('var(--orange)','2'), 'majeur'],
    [dotIcon('var(--yellow)','3'), 'annulaire'],
    [dotIcon('var(--orange)','4'), 'auriculaire'],
    [dotIcon('var(--orange)','T'), 'pouce']
  ];
  const stringItems = [
    [dotIcon('var(--orange)',''), 'corde à vide'],
    [`<svg viewBox="0 0 22 22"><path d="M5 5L17 17M17 5L5 17" stroke="var(--red)" stroke-width="3" stroke-linecap="round"/></svg>`, 'non jouée']
  ];
  // la légende des doigts n'a de sens qu'en mode « Doigts »
  $('legend').innerHTML = (mode === 'fingers' ? [...fingerItems, ...stringItems] : stringItems)
    .map(([i,t]) => `<li>${i}${t}</li>`).join('');
}

$('roots').addEventListener('click', e => {
  const b = e.target.closest('button[data-root]'); if (!b) return;
  const cur = chordById(state.chord);
  const cands = CHORDS.filter(c => c.root === b.dataset.root);
  // on garde le même type (majeur → majeur, mineur → mineur) quand il existe
  state.chord = (cands.find(c => c.type === cur.type) || cands[0]).id;
  render();
});
$('types').addEventListener('click', e => {
  const b = e.target.closest('button[data-chord]'); if (!b) return;
  state.chord = b.dataset.chord; render();
});
$('modes').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return;
  state.mode = b.dataset.mode; render();
});
$('levels').addEventListener('click', e => {
  const b = e.target.closest('button[data-level]'); if (!b) return;
  state.pref = b.dataset.level; render();
});
document.addEventListener('keydown', e => {
  if (view !== 'chords') return;     // sur le fretboard, les flèches font défiler le manche
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const chord = chordById(state.chord);
  if (chord.levels.length < 2) return;
  const cur = nearestLevel(chord, state.pref);
  const i = chord.levels.findIndex(l => l.id === cur);
  const j = Math.max(0, Math.min(chord.levels.length-1, i + (e.key==='ArrowRight' ? 1 : -1)));
  if (j !== i){ state.pref = chord.levels[j].id; render(); }
});

/* ============================================================
   Fretboard — apprendre les notes du manche
   ============================================================ */
const FB = { nut:110, cell:62, frets:12, top:40, gap:52, r:22 };
const FB_NOTATIONS = MODES.filter(m => m.id !== 'fingers');       // A B C / Do Ré Mi
const FB_MODES = [ { id:'see', name:'Toutes les notes' }, { id:'review', name:'Révision' } ];
const FB_NOTES = [ { id:'all', name:'Toutes' }, { id:'naturals', name:'Naturelles seulement' } ];
const FB_EXERCISES = [ { id:'free', name:'Libre' }, { id:'quiz', name:'Quiz' } ];
// shown : ronds révélés en révision libre, sous la forme "corde-case"
const fb = { notation:'letters', notes:'all', mode:'see', exercise:'free', shown:new Set() };
// quiz : target = "corde-case" ; status = 'ask' | 'found' | 'revealed'
const quiz = { target:null, wrong:new Set(), status:'ask', score:0, total:0, timer:null };

const parseKey = key => key.split('-').map(Number);                      // [corde, case]
const noteIndex = key => { const [i,f] = parseKey(key); return (OPEN_SEMITONE[i] + f) % 12; };
const isShownNote = n => fb.notes === 'all' || !NOTE_NAMES[n].includes('#');
const isQuiz = () => fb.mode === 'review' && fb.exercise === 'quiz';

function drawFretboard(){
  const { nut, cell, frets, top, gap, r } = FB;
  const review = fb.mode === 'review' && fb.exercise === 'free';
  const right = nut + frets*cell;
  const bottom = top + 5*gap;
  let s = '';

  // frettes puis sillet
  for (let n=1;n<=frets;n++)
    s += `<line x1="${nut+n*cell}" x2="${nut+n*cell}" y1="${top}" y2="${bottom}" stroke="#a89c8a" stroke-width="2.5"/>`;
  s += `<line x1="${nut}" x2="${nut}" y1="${top-2}" y2="${bottom+2}" stroke="var(--line)" stroke-width="8" stroke-linecap="round"/>`;

  // cordes (aiguë en haut, grave en bas) + numéros 1 à 6
  [1.2,1.6,2.1,2.7,3.3,4].forEach((w,row) => {
    const y = top + row*gap;
    s += `<line x1="44" x2="${right}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="${w}"/>`;
    s += `<text x="22" y="${y+6}" text-anchor="middle" font-size="16" fill="#7a6e61">${row+1}</text>`;
  });

  // numéros de cases et repères du manche
  for (let n=1;n<=frets;n++){
    const cx = nut + (n-.5)*cell;
    s += `<text x="${cx}" y="${bottom+48}" text-anchor="middle" font-size="18" fill="#7a6e61">${n}</text>`;
    const marks = n === 12 ? [-8,8] : [3,5,7,9].includes(n) ? [0] : [];
    marks.forEach(dx => s += `<circle cx="${cx+dx}" cy="${bottom+66}" r="5" fill="#b9ad9b"/>`);
  }

  // un rond par corde et par case (case 0 = corde à vide, à gauche du sillet)
  for (let i=5;i>=0;i--){
    const cy = top + (5-i)*gap;
    for (let f=0;f<=frets;f++){
      const cx = f === 0 ? nut - 40 : nut + (f-.5)*cell;
      const key = `${i}-${f}`;
      if (!isShownNote(noteIndex(key))) continue;
      const note = noteAt(i, f, fb.notation);
      const target = isQuiz() && key === quiz.target;
      const visible = fb.mode === 'see' || (review && fb.shown.has(key)) || (target && quiz.status !== 'ask');
      let fill = !visible ? '#f2ede4' : note.includes('#') ? 'var(--orange)' : 'var(--yellow)';
      let stroke = visible ? 'var(--dot-stroke)' : '#bfb29e';
      let label = visible ? note : '';
      let ink = '#2b1a08';
      if (target){                      // bleu : question en cours ou réponse donnée ; vert : trouvé
        fill = stroke = quiz.status === 'found' ? '#2e8540' : '#2563b0';
        ink = '#fff';
        label = quiz.status === 'ask' ? '?' : note;
      }
      const where = `Corde ${6-i}, ${f === 0 ? 'à vide' : 'case ' + f}`;
      const said = visible ? note : 'note masquée';
      const attrs = review
        ? `class="cell rev" data-key="${key}" tabindex="0" role="button" aria-pressed="${visible}" aria-label="${where} : ${said}"`
        : target
          ? `class="cell target" aria-label="Question : ${where}"`
          : `class="cell" aria-label="${where} : ${said}"`;
      const size = label === '?' ? 27 : [0,21,19,17,15][label.length];
      s += `<g ${attrs}><circle cx="${cx}" cy="${cy}" r="${target ? r+2 : r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>` +
        (label ? `<text x="${cx}" y="${cy + size*.36}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${ink}">${label}</text>` : '') +
        `</g>`;
    }
  }
  $('fretboard').innerHTML = s;
}

const segmented = (list, attr, current) => list.map(o =>
  `<button type="button" ${attr}="${o.id}" aria-pressed="${o.id===current}">${o.name}</button>`).join('');

function renderFretboard(){
  const review = fb.mode === 'review';
  $('fbNotation').innerHTML = segmented(FB_NOTATIONS, 'data-notation', fb.notation);
  $('fbNotes').innerHTML = segmented(FB_NOTES, 'data-notes', fb.notes);
  $('fbMode').innerHTML = segmented(FB_MODES, 'data-fbmode', fb.mode);
  $('fbExerciseBox').hidden = !review;
  $('fbExercise').innerHTML = segmented(FB_EXERCISES, 'data-exercise', fb.exercise) +
    (fb.exercise === 'free'
      ? `<button type="button" class="ghost" data-clear ${fb.shown.size ? '' : 'disabled'}>Tout masquer</button>` : '');
  $('quiz').hidden = !isQuiz();
  if (isQuiz()) renderQuiz();

  const intro = !review ? 'Cases 0 (à vide) à 12 ; au-delà, les notes recommencent.'
    : isQuiz() ? 'Trouve la note du rond « ? ». Le score compte les réponses justes du premier coup.'
    : 'Clique sur un rond pour révéler sa note, reclique pour la cacher.';
  $('fbHint').textContent = intro + ' Corde 1 = e aiguë (en haut), corde 6 = E grave (en bas).' +
    (fb.notes === 'naturals' ? ' Les dièses et bémols sont masqués.' : '');
  drawFretboard();
}

/* ---------- quiz ---------- */
function renderQuiz(){
  const names = fb.notation === 'solfege' ? SOLFEGE : NOTE_NAMES;
  const good = noteIndex(quiz.target);
  const [i,f] = parseKey(quiz.target);
  const asking = quiz.status === 'ask';

  $('quizMsg').textContent =
    quiz.status === 'found' ? `Bravo, c’est ${names[good]} !`
    : quiz.status === 'revealed' ? `C’était ${names[good]}.`
    : quiz.wrong.size ? 'Pas tout à fait, essaie encore.'
    : `Quelle est la note ? (corde ${6-i}, ${f === 0 ? 'à vide' : 'case ' + f})`;

  // A B C commence à A ; Do Ré Mi commence à Do
  const start = fb.notation === 'solfege' ? 0 : 9;
  const order = Array.from({length:12}, (_,k) => (start + k) % 12).filter(isShownNote);
  $('quizAnswers').innerHTML = order.map(n => {
    const cls = !asking && n === good ? 'right' : quiz.wrong.has(n) ? 'wrong' : '';
    return `<button type="button" class="${cls}" data-note="${n}" ${!asking || quiz.wrong.has(n) ? 'disabled' : ''}>${names[n]}</button>`;
  }).join('');

  $('quizScore').textContent = `Score : ${quiz.score} / ${quiz.total}`;
  $('quizActions').innerHTML =
    asking ? '<button type="button" data-reveal>Voir la réponse</button>'
    : quiz.status === 'revealed' ? '<button type="button" data-next>Question suivante</button>' : '';
}

function newQuestion(){
  clearTimeout(quiz.timer);
  const keys = [];
  for (let i=0;i<6;i++) for (let f=0;f<=FB.frets;f++){
    const key = `${i}-${f}`;
    if (key !== quiz.target && isShownNote(noteIndex(key))) keys.push(key);   // jamais deux fois de suite la même case
  }
  quiz.target = keys[Math.floor(Math.random() * keys.length)];
  quiz.wrong.clear();
  quiz.status = 'ask';
}

// sur petit écran, amène le rond « ? » dans la partie visible du manche
function scrollToTarget(){
  const box = document.querySelector('.scroll'), el = $('fretboard').querySelector('.target');
  if (!el) return;
  const b = box.getBoundingClientRect(), t = el.getBoundingClientRect();
  if (t.left < b.left || t.right > b.right) box.scrollLeft += t.left - b.left - (b.width - t.width)/2;
}

function nextQuestion(){ newQuestion(); renderFretboard(); scrollToTarget(); }

function answer(n){
  if (quiz.status !== 'ask') return;
  if (n === noteIndex(quiz.target)){
    quiz.status = 'found';
    quiz.total++;
    if (!quiz.wrong.size) quiz.score++;
    quiz.timer = setTimeout(nextQuestion, 1200);
  } else {
    quiz.wrong.add(n);
  }
  renderFretboard();
}

// change de mode ou de type de révision : on repart de zéro
function setStudy(mode, exercise){
  if (mode === fb.mode && exercise === fb.exercise) return;
  clearTimeout(quiz.timer);
  Object.assign(fb, { mode, exercise });
  fb.shown.clear();
  Object.assign(quiz, { target:null, score:0, total:0 });
  if (isQuiz()) newQuestion();
}

function toggleCell(key){
  if (!fb.shown.delete(key)) fb.shown.add(key);
  renderFretboard();
}

$('fbNotation').addEventListener('click', e => {
  const b = e.target.closest('button[data-notation]'); if (!b) return;
  fb.notation = b.dataset.notation; renderFretboard();     // les ronds révélés le restent
});
$('fbNotes').addEventListener('click', e => {
  const b = e.target.closest('button[data-notes]'); if (!b) return;
  fb.notes = b.dataset.notes;
  // la question en cours porte sur une note qu'on vient de masquer : on en tire une autre
  if (isQuiz() && !isShownNote(noteIndex(quiz.target))) newQuestion();
  renderFretboard(); scrollToTarget();
});
$('fbMode').addEventListener('click', e => {
  const b = e.target.closest('button[data-fbmode]'); if (!b) return;
  setStudy(b.dataset.fbmode, fb.exercise);
  renderFretboard(); scrollToTarget();
});
$('fbExercise').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-clear')) fb.shown.clear();
  else setStudy('review', b.dataset.exercise);
  renderFretboard(); scrollToTarget();
});
$('quizAnswers').addEventListener('click', e => {
  const b = e.target.closest('button[data-note]'); if (b) answer(Number(b.dataset.note));
});
$('quizActions').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-next')) return nextQuestion();
  quiz.status = 'revealed';
  quiz.total++;
  renderFretboard();
});
$('fretboard').addEventListener('click', e => {
  const c = e.target.closest('.cell.rev'); if (c) toggleCell(c.dataset.key);
});
$('fretboard').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const c = e.target.closest('.cell.rev'); if (!c) return;
  e.preventDefault();
  const key = c.dataset.key;
  toggleCell(key);
  $('fretboard').querySelector(`[data-key="${key}"]`).focus();
});

/* ============================================================
   Onglets et URL
   ============================================================ */
let view = 'chords';

function setHash(h){
  try { history.replaceState(null, '', '#' + h); } catch(e){}
}

function setView(v){
  view = v;
  $('viewChords').hidden = v !== 'chords';
  $('viewFret').hidden = v !== 'fretboard';
  document.querySelector('main').classList.toggle('wide', v === 'fretboard');
  document.querySelectorAll('#views button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.view === v));
  if (v === 'fretboard'){ setHash('fretboard'); renderFretboard(); scrollToTarget(); }
  else render();
}

$('views').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view);
});

// état initial depuis l'URL (#Fs-l3, #Am-std, #fretboard)
(function init(){
  const hash = location.hash.slice(1);
  const m = hash.match(/^([A-Za-z0-9]+)-(l\d|bar|std)$/);
  if (m){ state.chord = m[1]; if (m[2] !== 'std') state.pref = m[2]; }
  checkData();
  setView(hash === 'fretboard' ? 'fretboard' : 'chords');
})();
</script>
