<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar chords</title>
<style>
  :root{
    --bg:#f6f1e9; --ink:#241c15; --muted:#7a6e61; --chip:#ebe3d6; --chip-hover:#e0d5c3;
    --accent:#e8791c; --accent-ink:#fff; --card:#fff; --line:#1b1b1b;
    --yellow:#f7c244; --orange:#ee8a2e; --dot-stroke:#c4691a; --red:#9b1c1c;
    --root-bg:#fde3c8; --root-ink:#8a3f00;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17130f; --ink:#f3ece1; --muted:#a39685; --chip:#2a231c; --chip-hover:#372e24;
      --root-bg:#4a2c10; --root-ink:#ffd2a1;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  html{scrollbar-gutter:stable}   /* la barre de défilement ne décale pas la page d'un onglet à l'autre */
  main{max-width:1200px; margin:0 auto; padding:14px 20px 16px}   /* même largeur sur tous les onglets */
  h1{font-size:1.4rem; margin:0; letter-spacing:-.01em}
  .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 6px}

  /* 1. notes */
  .roots{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
  .roots button{
    font:inherit; font-size:1.5rem; font-weight:700; padding:12px 0; border:0; border-radius:14px;
    background:var(--chip); color:var(--ink); cursor:pointer; transition:background .15s, transform .1s;
  }
  .roots button:hover{background:var(--chip-hover)}
  .roots button:active{transform:scale(.97)}
  .roots button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

  /* 2. accords de la note */
  .types{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
  .types button{
    font:inherit; font-size:.95rem; font-weight:600; padding:8px 15px; border:2px solid transparent; border-radius:999px;
    background:var(--chip); color:var(--ink); cursor:pointer; transition:background .15s;
  }
  .types button:hover{background:var(--chip-hover)}
  .types button[aria-pressed="true"]{background:var(--root-bg); color:var(--root-ink); border-color:var(--accent)}

  /* 3. niveaux  +  4. mode d'affichage */
  .levels,.modes{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
  .levels button,.modes button{
    font:inherit; font-size:.95rem; font-weight:600; padding:7px 14px; border:2px solid transparent; border-radius:999px;
    background:var(--chip); color:var(--ink); cursor:pointer; transition:background .15s;
  }
  .levels button:hover,.modes button:hover{background:var(--chip-hover)}
  /* sélection : orange avec bordure, comme les accords et les gammes ; seule la notation reste en noir et blanc */
  .levels button[aria-pressed="true"],.modes button[aria-pressed="true"]{background:var(--root-bg); color:var(--root-ink); border-color:var(--accent)}
  .modes.notation button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  .card{background:var(--card); border-radius:18px; padding:14px 8px 6px; box-shadow:0 2px 14px rgba(0,0,0,.08)}
  .card h2{margin:0; text-align:center; font-size:1.7rem; font-weight:500; color:#111; letter-spacing:-.01em}
  .card svg{display:block; width:100%; max-width:380px; height:auto; margin:0 auto}

  .tip{margin:0; font-size:1rem}
  .hint{font-size:.8rem; color:var(--muted); margin:0}

  /* titre et onglets sur la même ligne */
  .topbar{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:6px 24px; margin-bottom:14px; border-bottom:2px solid var(--chip)}
  .topbar h1{padding-bottom:6px}
  .views{display:flex; gap:22px}
  .views button{
    font:inherit; font-size:1rem; font-weight:700; padding:6px 2px 10px; margin-bottom:-2px; border:0;
    border-bottom:3px solid transparent; background:none; color:var(--muted); cursor:pointer;
  }
  .views button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--accent)}

  /* fretboard */
  /* tous les réglages sur une même ligne quand la largeur le permet */
  .controls{position:relative; z-index:5; display:flex; flex-wrap:wrap; column-gap:45px; align-items:flex-end; clip-path:inset(-8px -8px -200px -8px)}
  /* fin séparateur entre deux catégories ; en début de ligne, il tombe hors cadre et se trouve rogné */
  .controls .sep{position:relative}
  /* il a la hauteur des boutons : il commence sous le titre et s'arrête avant la marge du bas */
  .controls .sep::before{content:""; position:absolute; left:-23px; top:calc(.72rem * 1.45 + 6px); bottom:12px; width:1px; background:var(--chip-hover)}
  .controls .modes button{padding-left:10px; padding-right:10px}
  .modes button.ghost{background:none; border:2px solid var(--chip-hover); padding:7px 14px}
  .modes button[aria-disabled="true"],.modes button[aria-disabled="true"]:hover{opacity:.4; cursor:not-allowed; background:var(--chip)}
  /* « Réinitialiser » : petit lien à côté du titre ; sa place est réservée pour que rien ne bouge */
  .label-row{display:flex; align-items:center; gap:10px; height:calc(.72rem * 1.45); margin-bottom:6px}
  .label-row .label{margin:0}
  .reset{font:inherit; font-size:.75rem; line-height:1; padding:0; border:0; background:none; color:var(--muted); text-decoration:underline; text-underline-offset:2px; cursor:pointer}
  .reset:hover{color:var(--ink)}
  .reset.idle{visibility:hidden}
  /* explication au survol d'« Aléatoire » grisé : posée par-dessus la page, pour ne rien décaler */
  .tooltip{
    display:none; position:absolute; top:100%; right:0; width:max-content; max-width:100%; margin:-6px 0 0;
    padding:7px 11px; border-radius:8px; background:#5f5b57; color:#fff; font-size:.78rem; box-shadow:0 4px 12px rgba(0,0,0,.14);
  }
  .mode-field:has([data-fbmode="random"][aria-disabled="true"]:hover) .tooltip,
  .mode-field:has([data-fbmode="random"][aria-disabled="true"]:focus-visible) .tooltip{display:block}
  /* Notation est calée au bord droit des deux onglets ; sur le fretboard, elle va à la ligne avec Zone */
  .field-pair{flex:1 1 auto; display:flex; flex-wrap:wrap; column-gap:45px; align-items:flex-end}
  #fbNotationBox,#scNotationBox{margin-left:auto}
  @media (max-width:699px){ #fbNotationBox,#scNotationBox{margin-left:0} }
  /* zone : deux listes de frettes, au même gabarit que les pastilles */
  .modes.zone{flex-wrap:nowrap; align-items:center; font-size:.95rem; font-weight:600}
  .zone select{flex:1}
  .zone select{
    font:inherit; height:40px; padding:0 28px 0 14px; border:0; border-radius:999px; cursor:pointer; color:var(--ink);
    -webkit-appearance:none; appearance:none; background-color:var(--chip);
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:right 15px center,right 10px center; background-size:5px 5px; background-repeat:no-repeat;
  }
  .zone select:hover{background-color:var(--chip-hover)}
  .zone select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  /* fenêtre moyenne : pastilles resserrées pour garder les filtres du fretboard sur le moins de lignes possible */
  @media (min-width:700px) and (max-width:1209px){
    .controls,.field-pair{column-gap:33px}
    .controls .sep::before{left:-17px}
    #viewFret .modes{gap:5px; font-size:.88rem}
    #viewFret .modes button{font-size:.88rem; padding-left:7px; padding-right:7px}
    #viewFret .zone select{height:2.4rem; padding-left:10px; padding-right:24px}   /* même hauteur que les pastilles */
  }
  .scroll{overflow-x:auto}
  .card svg.board{max-width:none; min-width:700px; margin:0}
  .cell{cursor:pointer}   /* un clic fait entendre la note */
  .cell:hover circle{stroke:var(--accent); stroke-width:3.5}
  /* Scales : les notes se cliquent aussi */
  #scaleBoard .note{cursor:pointer}
  #scaleBoard .note:hover circle{stroke:var(--accent); stroke-width:4}
  #scaleBoard .note:focus{outline:none}
  #scaleBoard .note:focus-visible circle{stroke:var(--line); stroke-width:5}
  .cell:focus{outline:none}
  .cell:focus-visible circle{stroke:var(--line); stroke-width:4}
  /* Notes « Manuel » : rangée des 12 notes, comme dans Chords en plus petit */
  #fbNote{grid-template-columns:repeat(12,minmax(0,1fr)); gap:8px; margin-bottom:0; padding-bottom:12px}
  #fbNote button{font-size:1.05rem; padding:6px 0; border-radius:11px}
  @media (max-width:699px){ #fbNote{grid-template-columns:repeat(6,minmax(0,1fr))} }

  /* lecture d'une gamme : mêmes pastilles que les filtres, avec une icône */
  .modes button svg{width:14px; height:14px; margin-right:7px; vertical-align:-2px; fill:currentColor}
  /* Play : orange plein, pour se distinguer des filtres */
  .modes button.play{min-width:108px; background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .modes button.play:hover{filter:brightness(1.07)}
  .modes button.icon{padding:7px 11px}
  .modes button.icon svg{width:17px; height:17px; margin:0; vertical-align:-3px}
  .modes button svg.line{fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
  .controls .lecture{flex:0 1 505px}   /* place réservée aux vitesses : rien ne bouge quand la lecture démarre */
  /* fenêtre étroite : Lecture passe sous Position et Notation, quel que soit le nombre de positions */
  @media (min-width:700px) and (max-width:1179px){ .controls .lecture{order:1; flex-basis:100%} }
  .modes.positions{gap:6px}
  .controls .modes.positions button{min-width:40px; padding-left:0; padding-right:0}
  .controls .modes.positions button[data-pos="0"]{padding-left:11px; padding-right:11px}
  #scaleBoard .note.outside{opacity:.28}   /* notes hors de la position choisie */
  .modes.speeds{margin:0; flex-wrap:nowrap}   /* vitesses à la suite des boutons de lecture */
  /* nom de l'accord ou de la gamme, en gras ; un peu moins grand dans une fenêtre étroite */
  #viewChords,#viewScales{--title:clamp(1.35rem,2.4vw,1.75rem)}
  #viewChords .card h2,#viewScales .card h2{font-size:var(--title); font-weight:700; line-height:1.25}
  #scDesc{margin-top:12px}

  /* onglet Chords : notes et accords en haut ; diagramme à gauche (2/3) ; notation, niveaux et légende à droite (1/3) */
  #viewChords .roots{grid-template-columns:repeat(8,minmax(0,1fr))}
  #viewChords .roots,#scRoot{margin-bottom:12px}
  #viewChords .roots button,#scRoot button{font-size:1.3rem; padding:8px 0}
  /* Scales : la tonique, même rangée et même hauteur que les notes de Chords */
  #scRoot{grid-template-columns:repeat(12,minmax(0,1fr))}
  @media (max-width:899px){ #scRoot{gap:8px} #scRoot button{font-size:1.05rem} }
  @media (max-width:699px){ #scRoot{grid-template-columns:repeat(6,minmax(0,1fr))} }
  .chords-layout{
    display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); column-gap:28px; align-items:start;
    grid-template-areas:"figure display" "figure levels" "figure timer"; grid-template-rows:auto auto 1fr;
  }
  .chords-layout .figure{grid-area:figure}
  .chords-layout #levelsBox{grid-area:levels}
  .chords-layout .figure .hint{margin-top:10px}
  /* minuteur : sous les options, à droite du diagramme */
  .chords-layout #timerBox{grid-area:timer; margin-top:6px; min-width:0}
  .modes.timer-time{flex-wrap:nowrap; align-items:center}
  .modes.timer-time button.step{flex:none; width:40px; height:40px; padding:0; font-size:1.3rem; line-height:1}
  .modes.timer-time button.idle{visibility:hidden}   /* la durée ne se change qu'à l'arrêt */
  #tmTime{
    flex:1; min-width:0; width:100%; padding:2px 0; font:inherit; font-size:2.2rem; font-weight:700; text-align:center;
    font-variant-numeric:tabular-nums; color:var(--ink); background:none; border:2px solid var(--chip-hover); border-radius:14px;
  }
  #tmTime:read-only{border-color:transparent}
  #tmTime:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  #timerBox.done #tmTime{color:var(--accent)}
  .modes.timer-actions{gap:6px}
  .modes.timer-actions button{padding-left:10px; padding-right:10px}
  .modes.timer-actions button.play{flex:1; min-width:0; white-space:nowrap}
  #viewChords .levels{flex-wrap:nowrap; gap:6px; margin-bottom:14px}
  #viewChords .levels button{flex:1; padding:7px 0}
  .chords-layout .card{padding:10px 8px}
  .chords-layout .card svg{max-width:100%; max-height:420px}
  .chords-layout .display-box{grid-area:display}
  #viewChords .display-box .modes{flex-wrap:nowrap; gap:6px; margin-bottom:14px}
  #viewChords .display-box .modes button{flex:1 1 auto; padding:7px 4px; white-space:nowrap}
  /* survol d'un rond ou d'une croix du diagramme : même bulle grise que sur le fretboard */
  .chords-layout [data-tip]:focus{outline:none}
  .chords-layout [data-tip]:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  #chordTip{
    position:fixed; z-index:20; transform:translate(-50%,-100%); white-space:nowrap; pointer-events:none; margin:0;
    padding:7px 11px; border-radius:8px; background:#5f5b57; color:#fff; font-size:.78rem; box-shadow:0 4px 12px rgba(0,0,0,.14);
  }
  /* accord sans niveaux : le bloc disparaît */
  .chords-layout .off{display:none}
  @media (max-width:699px){
    #viewChords .roots{grid-template-columns:repeat(4,minmax(0,1fr))}
    .chords-layout{grid-template-columns:minmax(0,1fr)}
    /* sur téléphone, notation et niveaux restent au-dessus du diagramme */
    .chords-layout{grid-template-areas:"display" "levels" "figure" "timer"; grid-template-rows:none}
    .chords-layout .card svg{max-height:380px}
  }

  /* grand écran : chaque onglet tient dans la fenêtre sans défiler, le visuel prend la place restante */
  @media (min-width:700px) and (min-height:600px){
    main{height:100vh; height:100dvh; display:flex; flex-direction:column}
    #viewChords,#viewFret,#viewScales{flex:1; min-height:0; display:flex; flex-direction:column}

    #viewFret .card,#viewScales .card{flex:1 1 0; min-height:190px; max-height:520px; display:flex; flex-direction:column; padding:10px 8px}
    .card .scroll{flex:1; min-height:0; position:relative; overflow:hidden}
    .card svg.board{position:absolute; inset:0; width:100%; height:100%; min-width:0}

    .chords-layout{flex:1; min-height:0; grid-template-rows:auto auto minmax(0,1fr)}
    .chords-layout .figure{align-self:stretch; min-height:0; display:flex; flex-direction:column}
    .chords-layout .card{flex:1 1 0; min-height:200px; max-height:540px; position:relative}
    .chords-layout .card svg{position:absolute; top:calc(var(--title) * 1.25 + 14px); left:8px; width:calc(100% - 16px); height:calc(100% - var(--title) * 1.25 - 22px); max-width:none; max-height:none}
  }
  /* autant d'air entre les filtres et le manche qu'entre le titre du site et les filtres
     (les 12 px sous les boutons comptent déjà) */
  #viewFret .card,#viewScales .card{margin-top:calc(.72rem * 1.45 + 8px)}
  /* Chords : même air au-dessus du diagramme (et de la colonne de droite, qui reste alignée avec lui) */
  .chords-layout{padding-top:calc(.72rem * 1.45 + 8px)}
  /* sur téléphone, notation et niveaux sont au-dessus : l'espace va entre eux et le diagramme (14 px comptés) */
  @media (max-width:699px){ .chords-layout{padding-top:0} .chords-layout .figure{padding-top:calc(.72rem * 1.45 + 6px)} }
  /* petite fenêtre : la carte du manche peut se tasser un peu plus, pour tenir sans défiler */
  @media (min-width:700px) and (min-height:600px) and (max-height:700px){ #viewFret .card,#viewScales .card{min-height:130px} }
</style>
</head>
<body>
<main>
  <header class="topbar">
    <h1>Guitar chords</h1>
    <nav class="views" id="views" aria-label="Rubriques">
      <button type="button" data-view="chords" aria-pressed="true">Chords</button>
      <button type="button" data-view="fretboard" aria-pressed="false">Fretboard</button>
      <button type="button" data-view="scales" aria-pressed="false">Scales</button>
    </nav>
  </header>

  <div id="viewChords">
    <div class="roots" id="roots" role="group" aria-label="Note"></div>
    <div class="types" id="types" role="group" aria-label="Accord"></div>

    <div class="chords-layout">
      <div class="display-box">
        <p class="label">Notation</p>
        <div class="modes notation" id="modes" role="group" aria-label="Notation"></div>
      </div>

      <div id="levelsBox">
        <p class="label">Niveau</p>
        <div class="levels" id="levels" role="group" aria-label="Niveau de difficulté"></div>
      </div>

      <div class="figure"><!-- diagramme -->
        <section class="card" aria-live="polite">
          <h2 id="chordTitle"></h2>
          <svg id="diagram" viewBox="0 24 360 354" role="group"></svg>
        </section>
        <p class="hint">Survolez les éléments pour comprendre ce qu'ils représentent.</p>
      </div>

      <div id="timerBox">
        <p class="label">Minuteur</p>
        <div class="modes timer-time">
          <button type="button" class="step" id="tmLess" aria-label="Retirer 15 secondes">−</button>
          <input type="text" id="tmTime" value="1:00" maxlength="5" autocomplete="off" aria-label="Durée du minuteur (minutes:secondes)">
          <button type="button" class="step" id="tmMore" aria-label="Ajouter 15 secondes">+</button>
        </div>
        <div class="modes timer-actions">
          <button type="button" class="play" id="tmToggle" aria-pressed="false">Play</button>
          <button type="button" class="icon" id="tmReset" aria-label="Recommencer" title="Recommencer" hidden>
            <svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg>
          </button>
          <button type="button" class="ghost" id="tmStop" hidden>Stop</button>
        </div>
      </div>
    </div>
  </div><!-- /viewChords -->
  <p id="chordTip" role="tooltip" hidden></p>

  <div id="viewFret" hidden>
    <div class="controls">
      <div>
        <p class="label">Notes</p>
        <div class="modes" id="fbNotes" role="group" aria-label="Notes"></div>
      </div>
      <div class="sep mode-field">
        <div class="label-row">
          <p class="label">Mode</p>
          <button type="button" class="reset idle" id="fbClear" aria-label="Réinitialiser les notes révélées">Réinitialiser</button>
        </div>
        <div class="modes" id="fbMode" role="group" aria-label="Mode"></div>
        <p class="tooltip" id="fbTip" role="tooltip">Vous devez sélectionner au moins deux notes en mode Manuel</p>
      </div>
      <div class="field-pair">
        <div class="sep" id="fbZoneBox">
          <div class="label-row">
            <p class="label">Frettes</p>
            <button type="button" class="reset idle" id="fbZoneReset" aria-label="Réinitialiser les frettes">Réinitialiser</button>
          </div>
          <div class="modes zone" id="fbZone" role="group" aria-label="Frettes">
            <select id="fbFrom" aria-label="Première frette"></select>
            <span>à</span><select id="fbTo" aria-label="Dernière frette"></select>
          </div>
        </div>
        <div id="fbNotationBox">
          <p class="label">Notation</p>
          <div class="modes notation" id="fbNotation" role="group" aria-label="Notation"></div>
        </div>
      </div>
    </div>
    <div class="roots" id="fbNote" role="group" aria-label="Notes à afficher" hidden></div>
    <section class="card">
      <div class="scroll">
        <svg id="fretboard" class="board" viewBox="0 0 880 384" role="group" aria-label="Manche de guitare, cases 0 à 12"></svg>
      </div>
    </section>
  </div>

  <div id="viewScales" hidden>
    <div class="roots" id="scRoot" role="group" aria-label="Tonique"></div>
    <p class="label">Gamme</p>
    <div class="types" id="scType" role="group" aria-label="Gamme"></div>
    <div class="controls">
      <div>
        <p class="label">Position</p>
        <div class="modes positions" id="scPos" role="group" aria-label="Position sur le manche"></div>
      </div>
      <div class="sep lecture">
        <p class="label">Lecture</p>
        <div class="modes">
          <button type="button" class="play" id="plToggle" aria-pressed="false">Play</button>
          <button type="button" class="icon" id="plReset" aria-label="Recommencer" title="Recommencer" hidden>
            <svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg>
          </button>
          <button type="button" class="ghost" id="plStop" hidden>Stop</button>
          <span class="modes speeds" id="plSpeed" role="group" aria-label="Vitesse" hidden></span>
        </div>
      </div>
      <div id="scNotationBox">
        <p class="label">Notation</p>
        <div class="modes notation" id="scDisplay" role="group" aria-label="Notation"></div>
      </div>
    </div>

    <section class="card">
      <h2 id="scTitle"></h2>
      <div class="scroll">
        <svg id="scaleBoard" class="board" viewBox="0 0 880 384" role="group"></svg>
      </div>
    </section>

    <p class="tip" id="scDesc"></p>
  </div>

      tip:'L’index barre les 6 cordes à la case 1. C’est la forme de E majeur, décalée d’une case.' }
  ]},
  { id:'F69', label:'F69', root:'F', type:'69', base:1, levels: single(
      [x,x,3,2,3,3], [[3,2,2,'2'],[2,3,3,'1'],[3,4,4,'3'],[3,5,5,'4']],
      'Pas de barré : index sur G (case 2), majeur sur D (case 3), annulaire et auriculaire sur B et e (case 3). Ne joue pas les deux cordes graves.') },

  /* ---------- F# ---------- */
  { id:'Fs', label:'F#', root:'F#', type:'maj', base:2, levels:[
    { id:'l1', name:'Level 1', frets:[x,x,4,3,2,x],
      fingers:[[4,2,2,'3'],[3,3,3,'2'],[2,4,4,'1']],
      tip:'Même forme que le F, une case plus haut. Trois cordes (D, G, B), un doigt par corde.' },
    { id:'l2', name:'Level 2', frets:[x,x,4,3,2,2],
      fingers:[[4,2,2,'3'],[3,3,3,'2'],[2,4,5,'1']],
      tip:'Mini-barré de l’index sur B et e, case 2.' },
    { id:'l3', name:'Level 3', frets:[x,4,4,3,2,2],
      fingers:[[4,1,1,'3'],[4,2,2,'4'],[3,3,3,'2'],[2,4,5,'1']],
      tip:'On ajoute la corde de A (case 4). Annulaire et auriculaire côte à côte.' },
    { id:'l4', name:'Level 4', frets:[2,x,4,3,2,2],
      fingers:[[2,0,0,'T'],[4,2,2,'3'],[3,3,3,'2'],[2,4,5,'1']],
      tip:'Pouce sur le E grave (case 2). Ici le A à vide sonnerait faux : on étouffe la corde de A en l’effleurant avec le pouce.' },
    { id:'bar', name:'Bar chord', frets:[2,4,4,3,2,2],
      fingers:[[2,0,5,'1'],[4,1,1,'3'],[4,2,2,'4'],[3,3,3,'2']],
      tip:'L’index barre les 6 cordes à la case 2 : forme de E majeur décalée de deux cases.' }
  ]},

  /* ---------- G ---------- */
  { id:'G', label:'G', root:'G', type:'maj', base:1, levels: single(
      [3,2,0,0,3,3], [[3,0,0,'2'],[2,1,1,'1'],[3,4,4,'3'],[3,5,5,'4']],
      'Majeur sur le E grave (case 3), index sur A (case 2), annulaire et auriculaire sur B et e (case 3). Les 6 cordes sonnent.') },
  { id:'G5', label:'G5', root:'G', type:'5', base:1, levels: single(
      [3,x,0,0,3,3], [[3,0,0,'2'],[3,4,4,'3'],[3,5,5,'4']],
      'Version « power chord » : majeur sur le E grave, annulaire et auriculaire sur B et e (case 3). D et G à vide, la corde de A est étouffée.') }
];

/* ============================================================
   Utilitaires
   ============================================================ */
const ROOTS = ['A','B','C','D','E','F','F#','G'];
const STRING_NAMES = ['E','A','D','G','B','E'];
const OPEN_SEMITONE = [4,9,2,7,11,4];               // C = 0
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LEVEL_ORDER = ['l1','l2','l3','l4','bar'];
const $ = id => document.getElementById(id);

const SOLFEGE = ['Do','Do#','Ré','Ré#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const MODES = [
  { id:'fingers', name:'Doigts' },
  { id:'letters', name:'A B C' },
  { id:'solfege', name:'Do Ré Mi' }
];
// note jouée sur la corde i à la case fret, selon le mode (letters = A B C…, solfege = Do Ré Mi…)
function noteAt(i, fret, mode){
  const n = (OPEN_SEMITONE[i] + fret) % 12;
  return (mode === 'solfege' ? SOLFEGE : NOTE_NAMES)[n];
}
const fontFor = t => t.length <= 1 ? 22 : t.length === 2 ? 19 : t.length === 3 ? 16 : 13;
// texte centré dans une pastille : la ligne de base descend en proportion de la taille réellement utilisée
const labelSvg = (cx, cy, t, size = fontFor(t)) =>
  `<text x="${cx}" y="${cy + size*.36}" text-anchor="middle" font-size="${size}" font-weight="700" fill="#2b1a08">${t}</text>`;

// Contrôle de cohérence (console) : chaque corde jouée et non à vide doit avoir un doigt.
function checkData(){
  CHORDS.forEach(c => c.levels.forEach(l => {
    const tag = `${c.label} ${l.name}`.trim();
    l.frets.forEach((f,i) => {
      if (f === x || f === 0) return;
      const ok = l.fingers.some(([fr,a,b]) => fr === f && i >= a && i <= b);
      if (!ok) console.warn(`${tag}: corde ${STRING_NAMES[i]} case ${f} sans doigt`);
    });
    l.fingers.forEach(([fr,a,b]) => {
      for (let i=a;i<=b;i++){
        const f = l.frets[i];
        // sous un barré, une corde peut être tenue plus haut par un autre doigt (ou muette), jamais à vide
        const okBarre = a < b && f !== 0 && (f === x || f >= fr);
        if (f !== fr && !okBarre)
          console.warn(`${tag}: doigt case ${fr} sur corde ${STRING_NAMES[i]} incohérent`);
      }
    });
  }));
}

/* ============================================================
   Rendu du diagramme (SVG)
   ============================================================ */
const LEFT=78, GAP=44, TOP=84, ROW=62, ROWS=4, R=19;
const sx = i => LEFT + i*GAP;

// groupe survolable du diagramme : son explication s'affiche dans la bulle
const FINGER_NAMES = { 1:'Index', 2:'Majeur', 3:'Annulaire', 4:'Auriculaire', T:'Pouce' };
const tipped = (tip, inner) => `<g data-tip="${tip}" tabindex="0" role="img" aria-label="${tip}">${inner}</g>`;

function drawDiagram(chord, level, mode){
  const base = chord.base;
  const bottom = TOP + ROWS*ROW;
  let s = '';

  // numéros de cases à gauche
  for (let r=0;r<ROWS;r++)
    s += `<text x="34" y="${TOP+(r+.5)*ROW+8}" text-anchor="middle" font-size="22" fill="var(--muted)">${base+r}</text>`;

  // cases (traits horizontaux)
  for (let r=0;r<=ROWS;r++){
    const thick = (r===0 && base===1);
    s += `<line x1="${sx(0)-1}" x2="${sx(5)+1}" y1="${TOP+r*ROW}" y2="${TOP+r*ROW}" stroke="var(--line)" stroke-width="${thick?9:2.5}" stroke-linecap="square"/>`;
  }
  // cordes
  for (let i=0;i<6;i++)
    s += `<line x1="${sx(i)}" x2="${sx(i)}" y1="${TOP}" y2="${bottom}" stroke="var(--line)" stroke-width="2.5"/>`;

  // noms des cordes
  STRING_NAMES.forEach((n,i) => {
    s += `<text x="${sx(i)}" y="${bottom+34}" text-anchor="middle" font-size="22" fill="var(--muted)">${n}</text>`;
  });

  // cordes muettes / à vide (au-dessus du manche)
  const my = TOP - 34;
  level.frets.forEach((f,i) => {
    if (f === x){
      // le disque invisible élargit la zone de survol autour de la croix
      s += tipped('Non jouée', `<circle cx="${sx(i)}" cy="${my}" r="15" fill="transparent"/>` +
        `<path d="M${sx(i)-9} ${my-9} L${sx(i)+9} ${my+9} M${sx(i)+9} ${my-9} L${sx(i)-9} ${my+9}" stroke="var(--red)" stroke-width="3.5" stroke-linecap="round" fill="none"/>`);
    } else if (f === 0){
      const note = mode === 'fingers' ? '' : noteAt(i, 0, mode);
      s += tipped('Corde à vide', `<circle cx="${sx(i)}" cy="${my}" r="15" fill="var(--yellow)" stroke="var(--dot-stroke)" stroke-width="2"/>` +
        (note ? labelSvg(sx(i), my, note, Math.min(fontFor(note), 15)) : ''));      // pastille plus petite
    }
  });

  // doigts (barrés d'abord pour que les doigts simples passent par-dessus)
  const fingers = [...level.fingers].sort((a,b) => (b[2]-b[1]) - (a[2]-a[1]));
  fingers.forEach(([fret,a,b,lab]) => {
    const cy = TOP + (fret - base + .5)*ROW;
    const x1 = sx(a), x2 = sx(b);
    const shape = a===b
      ? `<circle cx="${x1}" cy="${cy}" r="${R}" fill="var(--yellow)" stroke="var(--dot-stroke)" stroke-width="2"/>`
      : `<rect x="${x1-R}" y="${cy-R}" width="${x2-x1+2*R}" height="${2*R}" rx="${R}" fill="var(--yellow)" stroke="var(--dot-stroke)" stroke-width="2"/>`;
    let txt = '';
    if (mode === 'fingers') {
      txt = labelSvg((x1+x2)/2, cy, lab);
    } else {
      // une note par corde réellement tenue par ce doigt (sous un barré, les cordes tenues plus haut ont leur propre doigt)
      for (let i=a;i<=b;i++) if (level.frets[i] === fret) txt += labelSvg(sx(i), cy, noteAt(i, fret, mode));
    }
    s += tipped(FINGER_NAMES[lab], shape + txt);
  });

  $('diagram').innerHTML = s;
}

/* ============================================================
   UI
   ============================================================ */
// chord : accord affiché ; pref : niveau souhaité (gardé quand on change d'accord)
// mode : contenu des pastilles — 'fingers' (défaut), 'letters' (A B C), 'solfege' (Do Ré Mi)
const state = { chord:'F', pref:'l1', mode:'fingers' };

function chordById(id){ return CHORDS.find(c => c.id === id) || CHORDS[0]; }

function nearestLevel(chord, wanted){
  if (chord.levels.length === 1) return chord.levels[0].id;
  if (chord.levels.some(l => l.id === wanted)) return wanted;
  const w = LEVEL_ORDER.indexOf(wanted);
  return [...chord.levels].sort((a,b) => {
    const da = Math.abs(LEVEL_ORDER.indexOf(a.id)-w), db = Math.abs(LEVEL_ORDER.indexOf(b.id)-w);
    return da - db || LEVEL_ORDER.indexOf(a.id) - LEVEL_ORDER.indexOf(b.id);
  })[0].id;
}

function render(){
  const chord = chordById(state.chord);
  state.chord = chord.id;
  const level = chord.levels.find(l => l.id === nearestLevel(chord, state.pref));
  const multi = chord.levels.length > 1;
  const siblings = CHORDS.filter(c => c.root === chord.root);

  // 1. notes
  $('roots').innerHTML = ROOTS.map(r =>
    `<button type="button" data-root="${r}" aria-pressed="${r===chord.root}">${r}</button>`).join('');

  // 2. accords de la note choisie (toujours affiché, pour que la page ne bouge pas)
  $('types').innerHTML = siblings.map(c =>
    `<button type="button" data-chord="${c.id}" aria-pressed="${c.id===chord.id}">${c.label}</button>`).join('');

  // 3. niveaux (masqués pour les accords sans progression ; la place reste réservée sur grand écran)
  $('levelsBox').classList.toggle('off', !multi);
  $('levels').innerHTML = multi ? chord.levels.map(l =>
    `<button type="button" data-level="${l.id}" aria-label="${l.name}" aria-pressed="${l.id===level.id}">${l.id === 'bar' ? 'Bar' : l.id.slice(1)}</button>`).join('') : '';

  // 4. mode d'affichage
  $('modes').innerHTML = MODES.map(m =>
    `<button type="button" data-mode="${m.id}" aria-pressed="${m.id===state.mode}">${m.name}</button>`).join('');

  // diagramme
  const title = multi ? `${chord.label} ${level.name}` : chord.label;
  $('chordTitle').textContent = chord.label;
  $('diagram').setAttribute('aria-label', `Diagramme de ${title}`);
  hideTip();
  drawDiagram(chord, level, state.mode);

  if (view === 'chords') setHash(`${chord.id}-${level.id}`);
}

/* ---------- bulle d'explication du diagramme ---------- */
function showTip(el){
  const r = el.getBoundingClientRect(), tip = $('chordTip');
  tip.textContent = el.dataset.tip;
  tip.style.left = `${r.left + r.width/2}px`;
  tip.style.top = `${r.top - 8}px`;
  tip.hidden = false;
}
function hideTip(){ $('chordTip').hidden = true; }
['mouseover','focusin'].forEach(type => $('diagram').addEventListener(type, e => {
  const el = e.target.closest('[data-tip]'); if (el) showTip(el);
}));
['mouseout','focusout'].forEach(type => $('diagram').addEventListener(type, e => {
  const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip();
}));
addEventListener('scroll', hideTip, { passive:true });

$('roots').addEventListener('click', e => {
  const b = e.target.closest('button[data-root]'); if (!b) return;
  const cur = chordById(state.chord);
  const cands = CHORDS.filter(c => c.root === b.dataset.root);
  // on garde le même type (majeur → majeur, mineur → mineur) quand il existe
  state.chord = (cands.find(c => c.type === cur.type) || cands[0]).id;
  render();
});
$('types').addEventListener('click', e => {
  const b = e.target.closest('button[data-chord]'); if (!b) return;
  state.chord = b.dataset.chord; render();
});
$('modes').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return;
  state.mode = b.dataset.mode; render();
});
$('levels').addEventListener('click', e => {
  const b = e.target.closest('button[data-level]'); if (!b) return;
  state.pref = b.dataset.level; render();
});
document.addEventListener('keydown', e => {
  if (view !== 'chords') return;     // sur le fretboard, les flèches font défiler le manche
  if (e.target.closest && e.target.closest('input, select')) return;   // dans le minuteur, elles déplacent le curseur
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const chord = chordById(state.chord);
  if (chord.levels.length < 2) return;
  const cur = nearestLevel(chord, state.pref);
  const i = chord.levels.findIndex(l => l.id === cur);
  const j = Math.max(0, Math.min(chord.levels.length-1, i + (e.key==='ArrowRight' ? 1 : -1)));
  if (j !== i){ state.pref = chord.levels[j].id; render(); }
});

/* ============================================================
   Fretboard — apprendre les notes du manche
   ============================================================ */
const FB = { nut:110, cell:62, frets:12, top:40, gap:52, r:22 };
const FB_NOTATIONS = MODES.filter(m => m.id !== 'fingers');       // A B C / Do Ré Mi
const FB_MODES = [ { id:'see', name:'Normal' }, { id:'hide', name:'Masquer' }, { id:'random', name:'Aléatoire' } ];
const FB_NOTES = [ { id:'all', name:'Toutes' }, { id:'naturals', name:'Naturelles' }, { id:'manual', name:'Manuel' } ];
// picked : notes cochées avec « Manuel » (A au départ)
// shown : ronds révélés en mode Masquer, sous la forme "corde-case"
// target / revealed : rond tiré au sort en mode Aléatoire, et réponse affichée ou non
// from / to : première et dernière frette de la zone affichée
const fb = { notation:'letters', notes:'all', picked:new Set([9]), mode:'see', shown:new Set(), target:null, revealed:false, from:0, to:FB.frets };

const parseKey = key => key.split('-').map(Number);                      // [corde, case]
const noteIndex = key => { const [i,f] = parseKey(key); return (OPEN_SEMITONE[i] + f) % 12; };
const isShownNote = n => fb.notes === 'manual' ? fb.picked.has(n) : fb.notes === 'all' || !NOTE_NAMES[n].includes('#');
const inZone = key => { const f = parseKey(key)[1]; return f >= fb.from && f <= fb.to; };
// un rond n'est sur le manche que s'il est dans la zone et que sa note est affichée
const isOnBoard = key => inZone(key) && isShownNote(noteIndex(key));
// avec des notes choisies à la main, le mode Aléatoire en demande au moins deux
const canRandom = () => fb.notes !== 'manual' || fb.picked.size >= 2;

// fond du manche (frettes, cordes, numéros, repères) : partagé par les onglets Fretboard et Scales
function boardSvg(frets = FB.frets){
  const { nut, cell, top, gap } = FB;
  const right = nut + frets*cell;
  const bottom = top + 5*gap;
  let s = '';

  // frettes puis sillet
  for (let n=1;n<=frets;n++)
    s += `<line x1="${nut+n*cell}" x2="${nut+n*cell}" y1="${top}" y2="${bottom}" stroke="#a89c8a" stroke-width="2.5"/>`;
  s += `<line x1="${nut}" x2="${nut}" y1="${top-2}" y2="${bottom+2}" stroke="var(--line)" stroke-width="8" stroke-linecap="round"/>`;

  // cordes (aiguë en haut, grave en bas) + numéros 1 à 6
  [1.2,1.6,2.1,2.7,3.3,4].forEach((w,row) => {
    const y = top + row*gap;
    s += `<line x1="44" x2="${right}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="${w}"/>`;
    s += `<text x="22" y="${y+6}" text-anchor="middle" font-size="16" fill="#7a6e61">${row+1}</text>`;
  });

  // numéros de cases et repères du manche
  for (let n=1;n<=frets;n++){
    const cx = nut + (n-.5)*cell;
    s += `<text x="${cx}" y="${bottom+48}" text-anchor="middle" font-size="18" fill="#7a6e61">${n}</text>`;
    const marks = n === 12 ? [-8,8] : [3,5,7,9].includes(n) ? [0] : [];
    marks.forEach(dx => s += `<circle cx="${cx+dx}" cy="${bottom+66}" r="5" fill="#b9ad9b"/>`);
  }
  return s;
}

function drawFretboard(){
  const { nut, cell, frets, top, gap, r } = FB;
  const hiding = fb.mode === 'hide';
  let s = boardSvg();

  // un rond par corde et par case (case 0 = corde à vide, à gauche du sillet)
  for (let i=5;i>=0;i--){
    const cy = top + (5-i)*gap;
    for (let f=0;f<=frets;f++){
      const cx = f === 0 ? nut - 40 : nut + (f-.5)*cell;
      const key = `${i}-${f}`;
      if (!isOnBoard(key)) continue;
      const note = noteAt(i, f, fb.notation);
      const target = fb.mode === 'random' && key === fb.target;
      const visible = fb.mode === 'see' || (hiding && fb.shown.has(key)) || (target && fb.revealed);
      let fill = !visible ? '#f2ede4' : note.includes('#') ? 'var(--orange)' : 'var(--yellow)';
      let stroke = visible ? 'var(--dot-stroke)' : '#bfb29e';
      let label = visible ? note : '';
      let ink = '#2b1a08';
      if (target){                      // rond tiré au sort : bleu, « ? » puis la réponse
        fill = stroke = '#2563b0';
        ink = '#fff';
        label = fb.revealed ? note : '?';
      }
      const where = `Corde ${6-i}, ${f === 0 ? 'à vide' : 'case ' + f}`;
      const said = visible ? note : 'note masquée';
      // aria-pressed seulement pour les ronds qui révèlent une note
      const attrs = `class="cell${target ? ' target' : ''}" data-key="${key}" tabindex="0" role="button" aria-label="${where} : ${said}"` +
        (hiding || target ? ` aria-pressed="${visible}"` : '');
      const size = label === '?' ? 27 : [0,21,19,17,15][label.length];
      s += `<g ${attrs}><circle cx="${cx}" cy="${cy}" r="${target ? r+2 : r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>` +
        (label ? `<text x="${cx}" y="${cy + size*.36}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${ink}">${label}</text>` : '') +
        `</g>`;
    }
  }
  $('fretboard').innerHTML = s;
}

const segmented = (list, attr, current) => list.map(o =>
  `<button type="button" ${attr}="${o.id}" aria-pressed="${o.id===current}">${o.name}</button>`).join('');

function renderFretboard(){
  $('fbNotation').innerHTML = segmented(FB_NOTATIONS, 'data-notation', fb.notation);
  $('fbNotes').innerHTML = segmented(FB_NOTES, 'data-notes', fb.notes);
  $('fbMode').innerHTML = segmented(FB_MODES, 'data-fbmode', fb.mode);
  if (!canRandom()){                                       // grisé ; l'explication s'affiche au survol
    const random = $('fbMode').querySelector('[data-fbmode="random"]');
    random.setAttribute('aria-disabled', 'true');
    random.setAttribute('aria-describedby', 'fbTip');
  }
  // « Réinitialiser » (Mode) n'apparaît que si un rond révélé est à l'écran
  $('fbClear').classList.toggle('idle', !(fb.mode === 'hide' && [...fb.shown].some(isOnBoard)));

  // la rangée des notes n'existe qu'avec « Manuel »
  const names = fb.notation === 'solfege' ? SOLFEGE : NOTE_NAMES;
  const start = fb.notation === 'solfege' ? 0 : 9;         // A B C commence à A ; Do Ré Mi commence à Do
  $('fbNote').hidden = fb.notes !== 'manual';
  $('fbNote').innerHTML = Array.from({length:12}, (_, k) => (start + k) % 12).map(n =>
    `<button type="button" data-note="${n}" aria-pressed="${fb.picked.has(n)}">${names[n]}</button>`).join('');

  // zone : son « Réinitialiser » n'apparaît que si elle est réduite
  $('fbFrom').value = fb.from;
  $('fbTo').value = fb.to;
  $('fbZoneReset').classList.toggle('idle', fb.from === 0 && fb.to === FB.frets);

  drawFretboard();
}

// mode Aléatoire : tire un rond au hasard dans la zone (jamais deux fois de suite le même, sauf s'il est seul)
function newTarget(){
  const keys = [];
  for (let i=0;i<6;i++) for (let f=0;f<=FB.frets;f++){
    const key = `${i}-${f}`;
    if (isOnBoard(key)) keys.push(key);
  }
  const others = keys.filter(key => key !== fb.target);
  const pool = others.length ? others : keys;
  fb.target = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  fb.revealed = false;
}

// sur petit écran, amène un rond dans la partie visible du manche
function revealOnBoard(svgId, selector){
  const box = $(svgId).parentElement, el = $(svgId).querySelector(selector);
  if (!el) return;
  const b = box.getBoundingClientRect(), t = el.getBoundingClientRect();
  if (t.left < b.left || t.right > b.right) box.scrollLeft += t.left - b.left - (b.width - t.width)/2;
}
const scrollToTarget = () => revealOnBoard('fretboard', '.target');

// clic sur un rond : on entend sa note, puis le mode en cours agit
function activateCell(key){
  playNote(...parseKey(key));
  if (fb.mode === 'hide'){
    if (!fb.shown.delete(key)) fb.shown.add(key);
  } else if (fb.mode !== 'random' || key !== fb.target){
    return;                             // rien d'autre à faire que jouer le son
  } else if (!fb.revealed){
    fb.revealed = true;                 // premier clic : la réponse
  } else {
    newTarget();                        // clic suivant : une autre note
  }
  renderFretboard(); scrollToTarget();
}

$('fbNotation').addEventListener('click', e => {
  const b = e.target.closest('button[data-notation]'); if (!b) return;
  fb.notation = b.dataset.notation; renderFretboard();     // les ronds révélés le restent
});
$('fbNotes').addEventListener('click', e => {
  const b = e.target.closest('button[data-notes]'); if (!b) return;
  fb.notes = b.dataset.notes;
  redrawTarget();
});

$('fbNote').addEventListener('click', e => {
  const b = e.target.closest('button[data-note]'); if (!b) return;
  const n = Number(b.dataset.note);
  if (!fb.picked.delete(n)) fb.picked.add(n);            // plusieurs notes à la fois
  redrawTarget();
});

// après un changement de notes ou de zone : on garde le rond tiré s'il convient encore, sinon on en tire un autre
function redrawTarget(){
  if (fb.mode === 'random'){
    if (!canRandom()) fb.mode = 'see';                   // plus assez de notes : retour au mode Normal
    else if (!(fb.target && isOnBoard(fb.target))) newTarget();
  }
  renderFretboard(); scrollToTarget();
}
$('fbFrom').innerHTML = $('fbTo').innerHTML =
  Array.from({ length:FB.frets+1 }, (_, f) => `<option value="${f}">${f}</option>`).join('');
$('fbZone').addEventListener('change', e => {
  const f = Number(e.target.value);
  // l'autre borne suit si besoin, pour que la zone reste dans le bon sens
  if (e.target.id === 'fbFrom'){ fb.from = f; fb.to = Math.max(fb.to, f); }
  else { fb.to = f; fb.from = Math.min(fb.from, f); }
  redrawTarget();
});
$('fbClear').addEventListener('click', () => { fb.shown.clear(); renderFretboard(); });
$('fbZoneReset').addEventListener('click', () => {
  fb.from = 0; fb.to = FB.frets;
  redrawTarget();
});
$('fbMode').addEventListener('click', e => {
  const b = e.target.closest('button[data-fbmode]');
  if (!b || b.getAttribute('aria-disabled') === 'true') return;
  if (b.dataset.fbmode !== fb.mode){
    fb.mode = b.dataset.fbmode;
    fb.shown.clear();                                      // chaque révision démarre à vide
    if (fb.mode === 'random') newTarget();
  }
  renderFretboard(); scrollToTarget();
});
$('fretboard').addEventListener('click', e => {
  const c = e.target.closest('.cell'); if (c) activateCell(c.dataset.key);
});
$('fretboard').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const c = e.target.closest('.cell'); if (!c) return;
  e.preventDefault();
  const key = c.dataset.key;
  const wasTarget = fb.mode === 'random' && key === fb.target;
  activateCell(key);
  // le manche a pu être redessiné : on rend le focus au même rond (ou au nouveau rond tiré)
  $('fretboard').querySelector(wasTarget ? '.target' : `[data-key="${key}"]`).focus();
});

/* ============================================================
   Scales — les gammes principales sur le manche
   steps : demi-tons au-dessus de la tonique
   ============================================================ */
const SCALES = [
  { id:'major', name:'Majeure', steps:[0,2,4,5,7,9,11],
    desc:'La gamme de référence, au son clair et lumineux.' },
  { id:'minor', name:'Mineure naturelle', steps:[0,2,3,5,7,8,10],
    desc:'Un son plus sombre et mélancolique.' },
  { id:'pentamaj', name:'Pentatonique majeure', steps:[0,2,4,7,9],
    desc:'Cinq notes au son ouvert, très présentes en country, folk et pop.' },
  { id:'pentamin', name:'Pentatonique mineure', steps:[0,3,5,7,10],
    desc:'La gamme classique pour commencer à improviser en rock et en blues.' },
  { id:'blues', name:'Blues', steps:[0,3,5,6,7,10], starts:[0,3,5,7,10],   // la blue note ne démarre pas de position
    desc:'La pentatonique mineure avec une note en plus, la « blue note » (♭5).' },
  { id:'harmonic', name:'Mineure harmonique', steps:[0,2,3,5,7,8,11],
    desc:'La mineure naturelle avec la 7e relevée, à la couleur orientale.' },
  { id:'melodic', name:'Mineure mélodique', steps:[0,2,3,5,7,9,11],
    desc:'La mineure avec 6e et 7e relevées (forme ascendante), courante en jazz.' }
];
const SPEEDS = [ { id:1300, name:'Lent' }, { id:800, name:'Normal' }, { id:450, name:'Rapide' } ];   // ms par note
// root : demi-ton de la tonique (C = 0, A = 9) ; pos : position jouée sur le manche (1 = sur la tonique, 0 = « Tout »)
const sc = { scale:'pentamin', root:9, pos:1, display:'letters' };
// player : step = index de la note en cours dans la séquence (-1 : arrêté, toute la gamme est affichée)
const player = { step:-1, timer:null, speed:800 };
const ICONS = {
  play:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>',
  pause: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3.2v11H3.5zM9.3 2.5h3.2v11H9.3z"/></svg>',
  stop:  '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>'
};

/* ---------- position à jouer ---------- */
const OPEN_PITCH = [0,5,10,15,19,24];     // hauteur de chaque corde à vide, en demi-tons au-dessus du E grave

// Il y a une position par note de la gamme sur la corde de E grave. La 1 part de la tonique, les suivantes
// montent le long du manche, puis reprennent en bas une fois la case 12 atteinte.
const positionSteps = scale => scale.starts || scale.steps;
// Dans une position, on monte la gamme note par note et on passe à la corde suivante
// dès que la note sort de la position (plus de 3 cases après la case de départ).
function buildPath(scale, root, pos = 1){
  const rootFret = (root - 4 + 12) % 12;                          // case de la tonique sur le E grave
  const start = (rootFret + positionSteps(scale)[pos - 1]) % 12;  // case de départ de la position
  const top = start + 3;
  const path = [];
  let s = 0;
  for (let pitch = start; ; pitch++){
    if (!scale.steps.includes((pitch - rootFret + 12) % 12)) continue;
    while (s < 5 && pitch - OPEN_PITCH[s] > top && pitch - OPEN_PITCH[s+1] >= 0) s++;
    const f = pitch - OPEN_PITCH[s];
    if (s === 5 && f > top) return path;
    path.push({ s, f });
  }
}
// aller puis retour (la note du sommet n'est jouée qu'une fois)
const sequence = path => [...path, ...path.slice(0,-1).reverse()];
const currentScale = () => SCALES.find(x => x.id === sc.scale);
// ce qu'on joue : la position choisie, ou toutes à la suite avec « Tout ». Chaque position se joue en
// aller-retour ; on garde pour chaque note sa position, le chemin de celle-ci et son rang dans l'aller-retour.
function playlist(){
  const positions = sc.pos ? [sc.pos] : positionSteps(currentScale()).map((_, k) => k + 1);
  return positions.flatMap(pos => {
    const path = buildPath(currentScale(), sc.root, pos);
    return sequence(path).map((note, rank) => ({ ...note, pos, path, rank }));
  });
}

/* ---------- lecture ---------- */
function pause(){ clearTimeout(player.timer); player.timer = null; }
function resetPlayer(){ pause(); stopVoice(); player.step = -1; }
const lastStep = () => playlist().length - 1;

/* ---------- son : vraies notes de guitare (échantillons mp3 intégrés) ---------- */
const SMP = { lead:.05, clip:2.0, slot:2.2, count:37 };   // 37 notes : E2 (corde grave à vide) → E5
let audioCtx = null, sampleBuf = null, voice = null;
function getCtx(){
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function loadSamples(){
  try {
    const bin = atob(GUITAR_MP3), bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    getCtx().decodeAudioData(bytes.buffer, b => { sampleBuf = b; }, () => {});
  } catch(e){}
}
// coupe la note en cours par un court fondu (évite le « clic »)
function stopVoice(){
  if (!voice || !audioCtx) return;
  const t = audioCtx.currentTime, { gain, src } = voice;
  gain.gain.cancelScheduledValues(t);
  gain.gain.setValueAtTime(gain.gain.value, t);
  gain.gain.linearRampToValueAtTime(0, t + 0.06);
  src.stop(t + 0.08);
  voice = null;
}
const onsets = {};
function onsetAt(idx){
  if (onsets[idx] !== undefined) return onsets[idx];
  const d = sampleBuf.getChannelData(0), sr = sampleBuf.sampleRate;
  const a = Math.max(0, Math.floor((idx * SMP.slot - 0.05) * sr)), b = Math.floor((idx * SMP.slot + 0.4) * sr);
  let pk = 0;
  for (let k = a; k < b; k++) pk = Math.max(pk, Math.abs(d[k]));
  let k = a;
  while (k < b && Math.abs(d[k]) < pk * 0.1) k++;                   // premier échantillon audible
  return onsets[idx] = Math.max(0, k / sr - 0.004);                 // départ 4 ms avant l'attaque
}
function playNote(i, f){
  try {
    const ctx = getCtx();
    if (ctx.state === 'suspended') ctx.resume();
    stopVoice();                               // la note précédente s'arrête quand la suivante commence
    if (!sampleBuf) return;
    const semi = OPEN_PITCH[i] + f;
    const idx = Math.min(semi, SMP.count - 1); // au-delà de E5 : on accélère la dernière note
    const src = ctx.createBufferSource();
    src.buffer = sampleBuf;
    src.playbackRate.value = Math.pow(2, (semi - idx) / 12);
    const gain = ctx.createGain();
    src.connect(gain); gain.connect(ctx.destination);
    // on repère l'attaque réelle dans le son décodé (certains navigateurs ajoutent un petit silence au début du mp3)
    const at = onsetAt(idx);
    src.start(ctx.currentTime, at, SMP.clip + SMP.lead - (at - idx * SMP.slot));
    voice = { gain, src };
  } catch(e){}
}

function tick(){
  player.step = Math.min(lastStep(), player.step + 1);
  const n = playlist()[player.step];
  if (n) playNote(n.s, n.f);
  if (player.step >= lastStep()) pause(); else player.timer = setTimeout(tick, player.speed);
  renderScales();
  revealOnBoard('scaleBoard', '.current');   // sur petit écran, la note en cours reste visible
}
function togglePlay(){
  if (player.timer){ pause(); stopVoice(); renderScales(); return; }
  if (player.step >= lastStep()) player.step = -1;    // terminé : on repart du début
  tick();
}

function renderScales(){
  const scale = currentScale();
  const solfege = sc.display === 'solfege';
  const names = solfege ? SOLFEGE : NOTE_NAMES;
  const active = player.step >= 0;          // lecture en cours ou en pause (sinon : toute la gamme)
  const list = playlist();
  const now = active ? list[player.step] : null;
  // position montrée : en lecture, celle de la note en cours ; au repos, celle choisie (aucune avec « Tout »)
  const shown = now ? now.pos : sc.pos;
  const path = shown ? buildPath(scale, sc.root, shown) : [];
  const inPosition = new Set(path.map(p => `${p.s}-${p.f}`));
  const { nut, cell, top, gap, r } = FB;
  // certaines positions montent au-delà de la case 12 : le manche s'allonge alors
  const frets = Math.max(FB.frets, ...list.map(p => p.f));

  $('scType').innerHTML = segmented(SCALES, 'data-scale', sc.scale);
  const start = solfege ? 0 : 9;           // A B C commence à A ; Do Ré Mi commence à Do
  $('scRoot').innerHTML = segmented(
    Array.from({length:12}, (_,k) => (start + k) % 12).map(n => ({ id:n, name:names[n] })), 'data-root-note', sc.root);
  $('scDisplay').innerHTML = segmented(FB_NOTATIONS, 'data-display', sc.display);
  $('scPos').innerHTML = segmented(
    [{ id:0, name:'Tout' }, ...positionSteps(scale).map((_, k) => ({ id:k+1, name:k+1 }))], 'data-pos', sc.pos);

  // un rond pour la note de la case f sur la corde i (rien si elle n'est pas dans la gamme)
  // seules les notes de la gamme sont dessinées ; la tonique est en bleu, la note en cours est entourée
  const dot = (i, f, current) => {
    const n = (OPEN_SEMITONE[i] + f) % 12;
    const k = scale.steps.indexOf((n - sc.root + 12) % 12);
    if (k < 0) return '';
    const isRoot = k === 0;
    const cx = f === 0 ? nut - 40 : nut + (f-.5)*cell;
    const cy = top + (5-i)*gap;
    const label = names[n];
    const size = [0,21,19,17,15][label.length];
    const fill = isRoot ? '#2563b0' : current ? 'var(--orange)' : 'var(--yellow)';
    const stroke = current ? 'var(--line)' : isRoot ? '#2563b0' : 'var(--dot-stroke)';
    const where = `Corde ${6-i}, ${f === 0 ? 'à vide' : 'case ' + f}`;
    const outside = !active && sc.pos > 0 && !inPosition.has(`${i}-${f}`);   // hors de la position choisie : estompée
    return `<g class="note${isRoot ? ' root' : ''}${current ? ' current' : ''}${outside ? ' outside' : ''}" data-s="${i}" data-f="${f}" tabindex="0" role="button" aria-label="${where} : ${label}">` +
      `<circle cx="${cx}" cy="${cy}" r="${current ? r+3 : r}" fill="${fill}" stroke="${stroke}" stroke-width="${current ? 5 : 2}"/>` +
      `<text x="${cx}" y="${cy + size*.36}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${isRoot ? '#fff' : '#2b1a08'}">${label}</text></g>`;
  };

  let s = boardSvg(frets);
  if (!active){
    for (let i=5;i>=0;i--) for (let f=0;f<=frets;f++) s += dot(i, f, false);
  } else {
    // les notes de la position apparaissent une à une à l'aller, puis restent affichées pendant le retour
    path.slice(0, now.rank + 1).filter(p => p.s !== now.s || p.f !== now.f).forEach(p => s += dot(p.s, p.f, false));
    s += dot(now.s, now.f, true);
  }
  $('scaleBoard').setAttribute('viewBox', `0 0 ${880 + (frets - FB.frets)*cell} 384`);
  $('scaleBoard').innerHTML = s;

  const playing = player.timer !== null;
  $('plToggle').innerHTML = playing ? `${ICONS.pause}Pause` : `${ICONS.play}Play`;
  $('plToggle').setAttribute('aria-pressed', playing);
  // recommencer, stop et vitesses n'existent qu'une fois la lecture lancée
  $('plReset').hidden = $('plStop').hidden = $('plSpeed').hidden = !active;
  $('plSpeed').innerHTML = segmented(SPEEDS, 'data-speed', player.speed);

  const used = path.map(p => p.f);
  const where = shown ? `Position ${shown} (frettes ${Math.min(...used)} à ${Math.max(...used)})` : 'Tout le manche';
  const title = `${names[sc.root]} · ${scale.name} · ${where}`;
  const notes = scale.steps.map(st => names[(sc.root + st) % 12]).join(', ');
  $('scTitle').textContent = title;
  $('scaleBoard').setAttribute('aria-label', `Gamme ${title} sur le manche : ${notes}`);
  $('scDesc').textContent = scale.desc;
}

// clic sur une note du manche : on l'entend
function hearScaleNote(e){
  const n = e.target.closest('.note'); if (!n) return false;
  playNote(Number(n.dataset.s), Number(n.dataset.f));
  return true;
}
$('scaleBoard').addEventListener('click', hearScaleNote);
$('scaleBoard').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && hearScaleNote(e)) e.preventDefault();
});
$('scType').addEventListener('click', e => {
  const b = e.target.closest('button[data-scale]'); if (!b) return;
  sc.scale = b.dataset.scale;
  if (sc.pos > positionSteps(currentScale()).length) sc.pos = 1;   // moins de positions dans cette gamme
  resetPlayer(); renderScales();
});
$('scRoot').addEventListener('click', e => {
  const b = e.target.closest('button[data-root-note]'); if (!b) return;
  sc.root = Number(b.dataset.rootNote); resetPlayer(); renderScales();
});
$('scPos').addEventListener('click', e => {
  const b = e.target.closest('button[data-pos]'); if (!b) return;
  sc.pos = Number(b.dataset.pos); resetPlayer(); renderScales();
  revealOnBoard('scaleBoard', '.note:not(.outside)');   // sur petit écran, on montre la position choisie
});
$('plStop').innerHTML = `${ICONS.stop}Stop`;
$('plToggle').addEventListener('click', togglePlay);
$('plReset').addEventListener('click', () => { resetPlayer(); tick(); });     // rejoue depuis la première note
$('plStop').addEventListener('click', () => { resetPlayer(); renderScales(); $('scaleBoard').parentElement.scrollLeft = 0; });
$('plSpeed').addEventListener('click', e => {
  const b = e.target.closest('button[data-speed]'); if (!b) return;
  player.speed = Number(b.dataset.speed);
  if (player.timer){ clearTimeout(player.timer); player.timer = setTimeout(tick, player.speed); }
  renderScales();
});
$('scDisplay').addEventListener('click', e => {
  const b = e.target.closest('button[data-display]'); if (!b) return;
  sc.display = b.dataset.display; renderScales();
});

/* ============================================================
   Minuteur (onglet Chords) : compte à rebours, 1 min par défaut
   ============================================================ */
const TIMER_STEP = 15, TIMER_MIN = 5, TIMER_MAX = 99*60 + 59;     // en secondes
// duration : durée choisie (s) ; ms : temps restant ; end : heure de fin quand le minuteur tourne
const timer = { duration:60, ms:60000, end:null, tick:null };
const clock = sec => `${Math.floor(sec/60)}:${String(sec % 60).padStart(2, '0')}`;
// « 2:30 » ou « 2 » (minutes) ; null si la saisie n'est pas une durée
function parseClock(text){
  const m = text.trim().match(/^(\d{1,2})(?::([0-5]?\d))?$/);
  return m ? Number(m[1])*60 + Number(m[2] || 0) : null;
}
function renderTimer(){
  const running = timer.end !== null, started = running || timer.ms !== timer.duration*1000;
  $('tmTime').value = clock(Math.ceil(timer.ms/1000));
  $('tmTime').readOnly = started;
  $('tmLess').classList.toggle('idle', started);
  $('tmMore').classList.toggle('idle', started);
  $('timerBox').classList.toggle('done', timer.ms === 0);
  $('tmToggle').innerHTML = running ? `${ICONS.pause}Pause` : `${ICONS.play}Play`;
  $('tmToggle').setAttribute('aria-pressed', running);
  $('tmReset').hidden = $('tmStop').hidden = !started;       // comme dans Scales : seulement une fois lancé
}
function stopTicking(){ clearInterval(timer.tick); timer.tick = null; timer.end = null; }
// fin du temps : trois notes de guitare
function ringTimer(){ [0,1,2].forEach(k => setTimeout(() => playNote(5, 12), k*450)); }
// le temps restant se calcule sur l'horloge : il reste juste même si l'onglet est en arrière-plan
function tickTimer(){
  const before = Math.ceil(timer.ms/1000);
  timer.ms = Math.max(0, timer.end - Date.now());
  if (!timer.ms){ stopTicking(); renderTimer(); ringTimer(); }
  else if (Math.ceil(timer.ms/1000) !== before) renderTimer();
}
function startTimer(){
  if (!timer.ms) timer.ms = timer.duration*1000;             // terminé : on repart de la durée choisie
  timer.end = Date.now() + timer.ms;
  timer.tick = setInterval(tickTimer, 200);
  try { getCtx().resume(); } catch(e){}                      // le clic autorise le son de fin
  renderTimer();
}
function pauseTimer(){ timer.ms = Math.max(1, timer.end - Date.now()); stopTicking(); renderTimer(); }
function resetTimer(){ stopTicking(); timer.ms = timer.duration*1000; renderTimer(); }
function setDuration(sec){ timer.duration = Math.min(TIMER_MAX, Math.max(TIMER_MIN, sec)); resetTimer(); }

$('tmStop').innerHTML = `${ICONS.stop}Stop`;
$('tmToggle').addEventListener('click', () => timer.end === null ? startTimer() : pauseTimer());
$('tmReset').addEventListener('click', () => { resetTimer(); startTimer(); });
$('tmStop').addEventListener('click', resetTimer);
$('tmLess').addEventListener('click', () => setDuration(timer.duration - TIMER_STEP));
$('tmMore').addEventListener('click', () => setDuration(timer.duration + TIMER_STEP));
$('tmTime').addEventListener('focus', e => { if (!e.target.readOnly) e.target.select(); });
$('tmTime').addEventListener('change', e => {
  const sec = parseClock(e.target.value);
  if (sec === null) renderTimer(); else setDuration(sec);    // saisie illisible : on garde la durée
});
$('tmTime').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* ============================================================
   Onglets et URL
   ============================================================ */
let view = 'chords';

function setHash(h){
  try { history.replaceState(null, '', '#' + h); } catch(e){}
}

function setView(v){
  view = v;
  $('viewChords').hidden = v !== 'chords';
  $('viewFret').hidden = v !== 'fretboard';
  $('viewScales').hidden = v !== 'scales';
  hideTip();
  if (v !== 'scales') pause();     // la lecture d'une gamme s'arrête quand on change d'onglet
  document.querySelectorAll('#views button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.view === v));
  if (v === 'fretboard'){ setHash('fretboard'); renderFretboard(); scrollToTarget(); }
  else if (v === 'scales'){ setHash('scales'); renderScales(); }
  else render();
}

$('views').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view);
});

loadSamples();

// état initial depuis l'URL (#Fs-l3, #Am-std, #fretboard, #scales)
(function init(){
  const hash = location.hash.slice(1);
  const m = hash.match(/^([A-Za-z0-9]+)-(l\d|bar|std)$/);
  if (m){ state.chord = m[1]; if (m[2] !== 'std') state.pref = m[2]; }
  checkData();
  renderTimer();
  setView(hash === 'fretboard' || hash === 'scales' ? hash : 'chords');
})();
</script>
